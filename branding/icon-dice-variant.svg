<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Glow effect for nodes -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Colors -->
    <style>
      .connection { stroke: #404040; stroke-width: 1.5; opacity: 0.7; }
      .connection-highlight { stroke: #e0e0e0; stroke-width: 1.8; opacity: 0.8; }
      .position { fill: #4CAF50; } /* Green - positions */
      .submission { fill: #E53935; } /* Red - submissions */
      .transition { fill: #42A5F5; } /* Blue - transitions */
      .system { fill: #AB47BC; } /* Purple - systems */
      .principle { fill: #7E57C2; } /* Deep purple - principles */
    </style>
  </defs>
  
  <!-- No background - transparent -->
  
  <!-- Visible face fills (subtle white, 10% opacity) -->
  <g class="face-fills">
    <!-- Top face: 2, 3, 7, 6 -->
    <polygon points="87.1,35.3 28.0,81.1 92.8,99.4 151.9,53.6" fill="white" opacity="0.1"/>
    <!-- Left face: 0, 3, 7, 4 -->
    <polygon points="48.1,156.4 28.0,81.1 92.8,99.4 112.9,174.7" fill="white" opacity="0.1"/>
    <!-- Front face: 4, 5, 6, 7 -->
    <polygon points="112.9,174.7 172.0,128.9 151.9,53.6 92.8,99.4" fill="white" opacity="0.1"/>
  </g>
  
  <!-- 
    Properly projected cube with rotation:
    rot_y=40°, rot_x=30°, rot_z=15° (tumbling dice)
    
    Vertices (projected):
      0: (48.1, 156.4)  - back-bottom-left
      1: HIDDEN         - back-bottom-right (z=-1.72, deepest)
      2: (87.1, 35.3)   - back-top-right
      3: (28.0, 81.1)   - back-top-left
      4: (112.9, 174.7) - front-bottom-left
      5: (172.0, 128.9) - front-bottom-right
      6: (151.9, 53.6)  - front-top-right
      7: (92.8, 99.4)   - front-top-left (center)
    
    Visible faces: top (2,3,6,7), front (4,5,6,7), left (0,3,4,7)
  -->
  
  <!-- Connections (visible cube edges) -->
  <g class="connections">
    <!-- Top face edges: 2-3, 3-7, 7-6, 6-2 -->
    <line x1="87.1" y1="35.3" x2="28.0" y2="81.1" class="connection-highlight"/>
    <line x1="28.0" y1="81.1" x2="92.8" y2="99.4" class="connection-highlight"/>
    <line x1="92.8" y1="99.4" x2="151.9" y2="53.6" class="connection-highlight"/>
    <line x1="151.9" y1="53.6" x2="87.1" y2="35.3" class="connection-highlight"/>
    
    <!-- Front face edges: 4-5, 5-6, 6-7, 7-4 -->
    <line x1="112.9" y1="174.7" x2="172.0" y2="128.9" class="connection-highlight"/>
    <line x1="172.0" y1="128.9" x2="151.9" y2="53.6" class="connection-highlight"/>
    <line x1="92.8" y1="99.4" x2="112.9" y2="174.7" class="connection-highlight"/>
    
    <!-- Left face edges: 0-3, 3-7, 7-4, 4-0 -->
    <line x1="48.1" y1="156.4" x2="28.0" y2="81.1" class="connection-highlight"/>
    <line x1="112.9" y1="174.7" x2="48.1" y2="156.4" class="connection-highlight"/>
    
    <!-- X on top face (2-7, 3-6) -->
    <line x1="87.1" y1="35.3" x2="92.8" y2="99.4" class="connection"/>
    <line x1="28.0" y1="81.1" x2="151.9" y2="53.6" class="connection"/>
    
    <!-- X on front face (4-6, 5-7) -->
    <line x1="112.9" y1="174.7" x2="151.9" y2="53.6" class="connection"/>
    <line x1="172.0" y1="128.9" x2="92.8" y2="99.4" class="connection"/>
    
    <!-- X on left face (0-7, 3-4) -->
    <line x1="48.1" y1="156.4" x2="92.8" y2="99.4" class="connection"/>
    <line x1="28.0" y1="81.1" x2="112.9" y2="174.7" class="connection"/>
  </g>
  
  <!-- Dice dots (properly projected) -->
  <g class="dice-dots" fill="white" opacity="0.9">
    <!-- Top face: 1 dot (center) -->
    <circle cx="89.9" cy="67.4" r="5"/>
    
    <!-- Left face: 5 dots (4 corners + center) -->
    <circle cx="70.4" cy="127.9" r="3.5"/>
    <circle cx="80.5" cy="115.1" r="3.5"/>
    <circle cx="51.3" cy="106.8" r="3.5"/>
    <circle cx="89.6" cy="149.0" r="3.5"/>
    <circle cx="60.4" cy="140.7" r="3.5"/>
    
    <!-- Front face: 4 dots (corners) -->
    <circle cx="141.2" cy="86.9" r="3.5"/>
    <circle cx="114.6" cy="107.5" r="3.5"/>
    <circle cx="150.2" cy="120.8" r="3.5"/>
    <circle cx="123.6" cy="141.4" r="3.5"/>
  </g>
  
  <!-- Nodes (7 visible vertices) -->
  <g class="nodes" filter="url(#glow)">
    <circle cx="87.1" cy="35.3" r="9" class="position"/>      <!-- 2: back-top-right - Green -->
    <circle cx="28.0" cy="81.1" r="8" class="system"/>        <!-- 3: back-top-left - Purple -->
    <circle cx="48.1" cy="156.4" r="7" class="transition"/>   <!-- 0: back-bottom-left - Blue -->
    <circle cx="112.9" cy="174.7" r="9" class="submission"/>  <!-- 4: front-bottom-left - Red -->
    <circle cx="172.0" cy="128.9" r="7" class="transition"/>  <!-- 5: front-bottom-right - Blue -->
    <circle cx="151.9" cy="53.6" r="9" class="submission"/>   <!-- 6: front-top-right - Red -->
    <circle cx="92.8" cy="99.4" r="10" class="position"/>     <!-- 7: front-top-left (center) - Green -->
  </g>
</svg>
