
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Sora:wght@500;600;700&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;height:100%;background:#1a1a2e;overflow:hidden;}
  *{box-sizing:border-box;}
  @keyframes ngFadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes ngHintFade{0%{opacity:0;}12%,68%{opacity:.5;}100%{opacity:0;}}
  @keyframes ngIntroLife{0%{opacity:0;transform:translateY(10px);}20%{opacity:1;transform:translateY(0);}77%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(0);}}
  @keyframes ngTabPulse{0%,100%{box-shadow:0 6px 26px rgba(0,0,0,.4),0 0 0 0 rgba(120,160,255,.34);}50%{box-shadow:0 6px 26px rgba(0,0,0,.4),0 0 0 7px rgba(120,160,255,0);}}
  .ng-optionrow{-ms-overflow-style:none;scrollbar-width:none;mask-image:linear-gradient(90deg,transparent 0,#000 36px,#000 calc(100% - 36px),transparent 100%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 36px,#000 calc(100% - 36px),transparent 100%);scroll-padding:0 28px;}
  .ng-optionrow::-webkit-scrollbar{height:0;display:none;}
  .ng-optionrow > *{scroll-snap-align:center;}
  .ng-logo:hover span{color:#fff;}
  .ng-logo:hover .ng-kbd{opacity:1;color:#9fb0d8;}
  .ng-logo .ng-kbd span{color:inherit;}
  @keyframes ngSpin{to{transform:rotate(360deg);}}
  @keyframes ngCount{from{transform:scaleX(1);}to{transform:scaleX(0);}}
  @keyframes ngCardIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes ngNudge{0%,100%{transform:translateX(0);}50%{transform:translateX(5px);}}
  @keyframes ngDeckExpire{0%{filter:grayscale(0) brightness(1);opacity:1;}55%{filter:grayscale(.35) brightness(.92);opacity:.92;}100%{filter:grayscale(1) brightness(.5);opacity:.34;}}
  @keyframes ngPulseChip{0%,100%{box-shadow:0 0 0 0 rgba(120,170,255,.5);}50%{box-shadow:0 0 0 6px rgba(120,170,255,0);}}
  .ng-chip-merged{background:transparent!important;border-color:transparent!important;backdrop-filter:none!important;}
  .ngAcctChip{background:rgba(26,30,52,.66);backdrop-filter:blur(8px);border:1px solid rgba(150,170,210,.2);border-radius:999px;transition:background .2s ease,border-color .2s ease,backdrop-filter .2s ease;}
  .ngAcctChip.ng-chip-merged{background:transparent;border-color:transparent;backdrop-filter:none;}
  .ngSignupCta{cursor:pointer;font-size:11.5px;font-weight:700;color:#fff;background:linear-gradient(135deg,#4a6cff,#6a5cff);border-radius:999px;padding:8px 14px;box-shadow:0 3px 14px rgba(74,108,255,.42);white-space:nowrap;letter-spacing:.01em;transition:filter .15s ease,transform .15s ease,box-shadow .15s ease;}
  .ngSignupCta:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 5px 18px rgba(74,108,255,.5);}
  *{scrollbar-width:thin;scrollbar-color:rgba(120,150,210,.32) transparent;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(120,150,210,.28);border-radius:8px;border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(150,180,255,.5);border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-corner{background:transparent;}
  /* ---------- responsive ---------- */
  @media (max-width:1023px){
    .ng-explorer{width:min(330px,86vw)!important;}
    .ng-drill{width:min(312px,84vw)!important;}
  }
  @media (max-width:640px){
    .ng-logo{top:22px!important;left:18px!important;gap:0!important;}
    .ng-acctwrap{top:18px!important;right:18px!important;}
    .ngAcctChip{padding:0!important;}
    .ng-logo .ng-word,.ng-logo .ng-kbd{display:none!important;}
    .ng-intro{top:54px!important;left:16px!important;}
    .ng-intro>div:first-child{font-size:21px!important;}
    .ng-intro>div:last-child{font-size:12px!important;max-width:228px!important;margin-top:8px!important;}
    .ng-explorer,.ng-drill{width:80vw!important;}
    .ng-drilltab{top:auto!important;bottom:28px!important;right:14px!important;left:auto!important;transform:none!important;width:auto!important;min-height:46px!important;box-sizing:border-box!important;flex-direction:row!important;align-items:center!important;border-radius:23px!important;border-right:1px solid rgba(130,160,255,.32)!important;padding:8px 15px!important;gap:0!important;}
    .ng-drilltab>span:first-child{display:none!important;}
    .ng-drilltab .ng-dttitle,.ng-drilltab .ng-dtsub{display:none!important;}
    .ng-drilltab>div{display:none!important;}
    .ng-drilltab .ng-dt-short{display:block!important;text-align:center!important;}
    .ngAcctChip>span:first-child{display:none!important;}
    .ngSignupCta{display:none!important;}
    .ng-evtoast{width:86vw!important;}
    .ng-optionrow{padding:10px 12px 6px!important;gap:9px!important;}
    .ng-legendkey{display:none!important;}
    .ng-seemore{display:none!important;}
    .ng-winbar{width:104px!important;}
    .ng-legend{left:14px!important;bottom:27px!important;gap:0!important;}
  }
</style>
<script src="technique-content.js"></script>
</helmet>
<div ref="{{ wrapRef }}" style="position:fixed;inset:0;background:#1a1a2e;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;cursor:grab;touch-action:none;">
  <canvas ref="{{ canvasRef }}" style="position:absolute;inset:0;display:block;width:100%;height:100%;"></canvas>

  <!-- semantic zoom: the dossier lives inside the node once you zoom close enough -->
  <div ref="{{ nodeCardRef }}" style="display:none;position:absolute;left:0;top:0;width:560px;height:560px;z-index:3;transform-origin:50% 50%;will-change:transform,opacity;pointer-events:none;"></div>

  <div ref="{{ loaderRef }}" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
    <div style="width:26px;height:26px;border:2px solid rgba(255,255,255,.15);border-top-color:rgba(120,160,255,.9);border-radius:50%;animation:ngSpin .9s linear infinite;"></div>
  </div>

  <!-- dominance flash overlay -->
  <div ref="{{ fxRef }}" style="position:absolute;inset:0;pointer-events:none;opacity:0;"></div>

  <!-- account + config menu (top-right) -->
  <div ref="{{ accountRef }}" class="ng-acctwrap" style="position:absolute;top:26px;right:24px;pointer-events:auto;z-index:6;transition:opacity .25s ease;">
    <div ref="{{ acctChipRef }}" class="ngAcctChip {{ chipMergeClass }}" onClick="{{ toggleMenu }}" style="cursor:pointer;display:flex;align-items:center;gap:10px;padding:5px 7px 5px 14px;">
      <span style="font-size:12px;font-weight:600;color:#cbd4e6;letter-spacing:.01em;">Guest</span>
      <span style="width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#4a6cff,#9a5cff);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;box-shadow:0 2px 10px rgba(74,108,255,.4);">G</span>
    </div>
  </div>

  <!-- modal overlay (settings / auth) -->
  <div ref="{{ modalRef }}" style="display:none;position:absolute;inset:0;z-index:9;background:rgba(8,9,16,.6);backdrop-filter:blur(3px);align-items:center;justify-content:center;pointer-events:auto;">
    <div ref="{{ modalCardRef }}" style="width:min(440px,90vw);background:linear-gradient(180deg,rgba(26,30,52,.99),rgba(18,21,38,.99));border:1px solid rgba(130,150,190,.2);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.65);overflow:hidden;animation:ngCardIn .28s ease both;"></div>
  </div>

  <!-- brand: revamped dice-graph logo + wordmark (top-left, persistent) -->
  <div class="ng-logo" onClick="{{ toggleExplorer }}" style="position:absolute;top:24px;left:34px;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:10px;z-index:9;">
    <div style="display:flex;flex-direction:column;gap:3px;">
      <span ref="{{ brandFontRef }}" class="ng-word" style="font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:500;letter-spacing:-.005em;color:#cbd4e6;line-height:1;transition:opacity .9s ease,color .2s;">bjjgraph<span style="color:#6b7691;">.org</span></span>
      <span class="ng-kbd" style="display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:600;color:#6b7691;background:transparent;border-radius:6px;padding:1px 0 0;letter-spacing:.03em;width:max-content;opacity:.6;transition:opacity .2s,color .2s;">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>Explore <span style="opacity:.65;font-weight:700;">/</span>
      </span>
    </div>
  </div>

  <!-- transport controls (bottom center) -->
  <div ref="{{ transportRef }}" style="position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:4;pointer-events:auto;display:flex;align-items:center;gap:6px;background:rgba(24,28,48,.66);backdrop-filter:blur(8px);border:1px solid rgba(150,170,210,.16);border-radius:999px;padding:5px 7px;">
    <button ref="{{ playPauseRef }}" onClick="{{ togglePause }}" title="Pause" style="cursor:pointer;width:34px;height:34px;border:none;border-radius:50%;background:rgba(255,255,255,.08);color:#eef1f6;display:flex;align-items:center;justify-content:center;padding:0;"></button>
    <button onClick="{{ resetRoll }}" title="Restart roll" style="cursor:pointer;width:34px;height:34px;border:none;border-radius:50%;background:transparent;color:#aeb6c8;display:flex;align-items:center;justify-content:center;padding:0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg></button>
  </div>

  <!-- persistent status HUD (top-left, after intro) -->
  <div class="ng-intro" style="position:absolute;top:72px;left:36px;pointer-events:none;animation:ngIntroLife 6.5s cubic-bezier(.2,.7,.2,1) .4s both;">
    <div style="font-size:28px;font-weight:700;color:#eef1f6;letter-spacing:-.01em;line-height:1.05;">Roll the graph.</div>
    <div style="font-size:13px;color:#9aa3b8;margin-top:11px;max-width:300px;line-height:1.5;font-weight:400;">A live roll plays out across the map. Choose your move, or let it flow.</div>
  </div>

  <!-- explorer sidebar (left, toggled by the logo) -->
  <div ref="{{ explorerRef }}" class="ng-explorer" style="display:none;position:absolute;top:0;left:0;bottom:0;width:330px;z-index:8;background:linear-gradient(180deg,rgba(18,21,38,.98),rgba(13,15,28,.98));border-right:1px solid rgba(130,150,190,.16);box-shadow:14px 0 44px rgba(0,0,0,.5);flex-direction:column;pointer-events:auto;">
    <div ref="{{ giToggleRef }}" style="position:absolute;top:27px;right:16px;z-index:2;display:flex;align-items:center;border:1px solid rgba(150,170,210,.2);border-radius:999px;background:rgba(255,255,255,.03);overflow:hidden;">
      <span data-gi="gi" style="cursor:pointer;font-size:9px;font-weight:800;letter-spacing:.08em;padding:5px 11px;color:#0e1630;background:#9fb0d8;">GI</span>
      <span data-gi="nogi" style="cursor:pointer;font-size:9px;font-weight:800;letter-spacing:.08em;padding:5px 11px;color:#8b97b0;background:transparent;">NO-GI</span>
    </div>
    <div style="padding:74px 18px 12px;flex:none;display:flex;gap:9px;align-items:center;">
      <div style="flex:1;display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:11px;border:1px solid rgba(150,170,210,.2);background:rgba(255,255,255,.05);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8b97b0" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input ref="{{ explorerSearchRef }}" placeholder="Search techniques&hellip;" style="flex:1;min-width:0;font-family:inherit;font-size:13px;color:#eef1f6;background:transparent;border:none;outline:none;">
      </div>
      <button onClick="{{ toggleExplorer }}" title="Close" style="cursor:pointer;width:38px;height:38px;border-radius:11px;border:1px solid rgba(150,170,210,.2);background:rgba(255,255,255,.04);color:#8b97b0;font-size:17px;flex:none;">&times;</button>
    </div>
    <div ref="{{ explorerListRef }}" style="flex:1;overflow-y:auto;padding:4px 10px 24px;"></div>
    <div ref="{{ dossierRef }}" style="display:none;flex:1;min-height:0;overflow-y:auto;position:relative;"></div>
  </div>

  <!-- mobile dossier sheet: drops from the top, leaves options + win bar + drill row visible below -->
  <div ref="{{ dossierSheetRef }}" style="display:none;position:absolute;top:0;left:0;right:0;height:70%;z-index:8;background:linear-gradient(180deg,rgba(18,21,38,.985),rgba(13,15,28,.985));border-bottom:1px solid rgba(130,150,190,.24);border-radius:0 0 20px 20px;box-shadow:0 20px 54px rgba(0,0,0,.55);overflow-y:auto;pointer-events:auto;padding-top:44px;box-sizing:border-box;transform:translateY(-102%);transition:transform .34s cubic-bezier(.2,.7,.2,1);"></div>

  <!-- event toast (top of play area) -->
  <div ref="{{ evRef }}" class="ng-evtoast" style="position:absolute;top:30px;left:50%;transform:translateX(-50%);pointer-events:none;opacity:0;transition:opacity .45s ease;text-align:center;width:min(540px,64vw);">
    <div ref="{{ evKickerRef }}" style="font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;font-weight:700;color:#7b97aa;margin-bottom:7px;">&nbsp;</div>
    <div ref="{{ evTextRef }}" style="font-size:22px;font-weight:600;color:#eef1f6;letter-spacing:-.01em;line-height:1.2;text-shadow:0 2px 14px rgba(0,0,0,.55);">&nbsp;</div>
  </div>

  <!-- options tray (bottom of play area) -->
  <div ref="{{ optionsRef }}" class="ng-optionrow" style="position:absolute;bottom:84px;left:0;right:0;z-index:4;pointer-events:none;display:flex;gap:12px;align-items:flex-end;justify-content:safe center;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:14px 24px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;"></div>
  <div ref="{{ optionHintRef }}" class="ng-seemore" onClick="{{ scrollOptions }}" style="position:absolute;bottom:60px;right:24px;z-index:3;pointer-events:none;cursor:pointer;opacity:0;transition:opacity .55s cubic-bezier(.4,0,.2,1),color .15s;display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:600;letter-spacing:.08em;color:#7e8aa8;text-transform:uppercase;">see more<span style="font-size:11px;display:inline-block;">&rarr;</span></div>

  <!-- option detail: a bottom sheet that expands in place (no dimming overlay) -->
  <div ref="{{ optDetailRef }}" style="position:absolute;left:0;right:0;bottom:0;margin:0 auto;width:min(660px,94vw);height:340px;z-index:6;opacity:0;pointer-events:none;transition:opacity .26s cubic-bezier(.2,.7,.2,1),transform .34s cubic-bezier(.2,.7,.2,1),height .34s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(27,31,53,.995),rgba(17,20,36,.995));border:1px solid rgba(130,150,190,.22);border-bottom:none;border-top-left-radius:20px;border-top-right-radius:20px;box-shadow:0 -16px 60px rgba(0,0,0,.55);overflow:hidden;"></div>

  <!-- drill open tab (right edge, when a deck is available but closed) -->
  <div ref="{{ drillTabRef }}" class="ng-drilltab" onClick="{{ openDeck }}" style="position:absolute;top:50%;right:0;transform:translateY(-50%);pointer-events:auto;cursor:pointer;opacity:0;display:flex;align-items:center;gap:11px;padding:15px 18px 15px 17px;background:linear-gradient(90deg,rgba(36,42,70,.92),rgba(26,30,52,.95));border:1px solid rgba(130,160,255,.32);border-right:none;border-radius:13px 0 0 13px;box-shadow:0 6px 26px rgba(0,0,0,.4);animation:ngTabPulse 2.4s ease infinite;z-index:6;">
    <span ref="{{ drillTabIconRef }}" style="font-size:17px;line-height:1;filter:drop-shadow(0 0 5px rgba(120,160,255,.6));">&#9889;</span>
    <div style="display:flex;flex-direction:column;gap:2px;">
      <span ref="{{ drillTabTitleRef }}" class="ng-dttitle" style="font-size:12.5px;font-weight:700;color:#eef1f6;letter-spacing:.01em;line-height:1.1;">5 cards to master</span>
      <span ref="{{ drillTabSubRef }}" class="ng-dtsub" style="font-size:10.5px;font-weight:500;color:#9ab0e0;letter-spacing:.02em;">Drill to boost your odds &rarr;</span>
    </div>
    <span ref="{{ drillTabShortRef }}" class="ng-dt-short" style="display:none;font-size:11px;font-weight:600;color:#c9d3e6;line-height:1.2;text-align:center;"></span>
  </div>

  <!-- drill sidebar (right) -->
  <div ref="{{ drillRef }}" class="ng-drill" style="position:absolute;top:0;right:0;bottom:0;width:312px;z-index:5;background:linear-gradient(180deg,rgba(20,23,40,.96),rgba(15,17,30,.96));backdrop-filter:blur(10px);border-left:1px solid rgba(150,170,210,.14);display:flex;flex-direction:column;pointer-events:auto;opacity:0;box-shadow:-12px 0 40px rgba(0,0,0,.45);">
    <div ref="{{ drillHeadRef }}" style="padding:30px 24px 16px;border-bottom:1px solid rgba(150,170,210,.1);flex:none;"></div>
    <div ref="{{ drillListRef }}" style="flex:1;overflow-y:auto;padding:14px 24px 14px;display:flex;flex-direction:column;gap:10px;"></div>
    <div ref="{{ drillFootRef }}" style="flex:none;padding:12px 24px 16px;border-top:1px solid rgba(150,170,210,.1);background:rgba(15,17,30,.55);display:flex;flex-direction:column;gap:9px;"></div>
    <div style="flex:none;display:flex;justify-content:center;align-items:center;gap:14px;padding:14px 24px 14px;">
      <span onClick="{{ openTerms }}" style="cursor:pointer;font-size:10.5px;color:#5d6883;letter-spacing:.02em;" style-hover="color:#9aa6bd;">Terms</span>
      <span style="width:3px;height:3px;border-radius:50%;background:#3c4358;"></span>
      <span onClick="{{ openPrivacy }}" style="cursor:pointer;font-size:10.5px;color:#5d6883;letter-spacing:.02em;" style-hover="color:#9aa6bd;">Privacy</span>
    </div>
  </div>

  <!-- round-end verdict (center) -->
  <div ref="{{ evCenterRef }}" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .55s ease;text-align:center;padding:0 24px;">
    <div ref="{{ evcKickerRef }}" style="font-size:13px;letter-spacing:.42em;text-transform:uppercase;font-weight:700;color:#8ba0c0;margin-bottom:14px;">&nbsp;</div>
    <div ref="{{ evcTextRef }}" style="font-size:clamp(40px,6vw,68px);font-weight:700;color:#eef1f6;letter-spacing:-.02em;line-height:1;text-shadow:0 4px 30px rgba(0,0,0,.6);">&nbsp;</div>
    <div ref="{{ evcSubRef }}" style="font-size:16px;font-weight:500;color:#aab4ca;margin-top:16px;letter-spacing:.01em;">&nbsp;</div>
  </div>

  <!-- legend (bottom left) -->
  <div class="ng-legend" style="position:absolute;bottom:30px;left:38px;z-index:1;display:flex;flex-direction:column;gap:16px;pointer-events:none;">
    <div ref="{{ legendRef }}" class="ng-legendkey" style="display:flex;flex-direction:column;gap:11px;opacity:0;transition:opacity .6s ease;">
      <div style="display:flex;align-items:center;gap:11px;">
        <span style="width:13px;height:13px;border-radius:50%;background:#c9d2e3;"></span>
        <span style="font-size:12px;color:#aeb6c8;font-weight:500;">Position</span>
      </div>
      <div style="display:flex;align-items:center;gap:11px;">
        <span style="width:11px;height:11px;background:#c9d2e3;transform:rotate(45deg);margin:0 1px;"></span>
        <span style="font-size:12px;color:#aeb6c8;font-weight:500;">Transition</span>
      </div>
      <div style="display:flex;align-items:center;gap:11px;">
        <span style="width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid #c9d2e3;"></span>
        <span style="font-size:12px;color:#aeb6c8;font-weight:500;">Submission</span>
      </div>
    </div>
    <div class="ng-winbar" style="display:flex;flex-direction:column;gap:7px;width:210px;">
      <div style="height:9px;border-radius:5px;background:linear-gradient(90deg,#e84040 0%,#8e8e94 50%,#4084ff 100%);position:relative;overflow:visible;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);">
        <div ref="{{ legendMarkRef }}" style="position:absolute;top:-4px;bottom:-4px;left:50%;width:2.5px;border-radius:2px;background:#fff;box-shadow:0 0 5px rgba(0,0,0,.6),0 0 3px rgba(255,255,255,.8);transform:translateX(-50%);opacity:0;">
          <span ref="{{ legendPointRef }}" style="position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #fff;"></span>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:10.5px;color:#8b93a8;font-weight:600;letter-spacing:.02em;">
        <span>Lose</span><span>Win</span>
      </div>
    </div>
  </div>


</div>
