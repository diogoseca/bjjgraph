
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link href="challenge-ui.css" rel="stylesheet">
<link href="challenge-collection.css" rel="stylesheet">
<link href="challenge-feedback.css" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;height:100%;background:#1a1a2e;overflow:hidden;}
  *{box-sizing:border-box;}
  @keyframes ngFadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes ngHintFade{0%{opacity:0;}12%,68%{opacity:.5;}100%{opacity:0;}}
  @keyframes ngTabPulse{0%,100%{box-shadow:0 6px 26px rgba(0,0,0,.4),0 0 0 0 rgba(120,160,255,.34);}50%{box-shadow:0 6px 26px rgba(0,0,0,.4),0 0 0 7px rgba(120,160,255,0);}}
  .ng-optionrow{-ms-overflow-style:none;scrollbar-width:none;mask-image:linear-gradient(90deg,transparent 0,#000 36px,#000 calc(100% - 36px),transparent 100%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 36px,#000 calc(100% - 36px),transparent 100%);scroll-padding:0 28px;}
  .ng-optionrow::-webkit-scrollbar{height:0;display:none;}
  .ng-optionrow > *{scroll-snap-align:center;}
  .ng-logo:hover span{color:#fff;}
  .ng-logo:hover .ng-kbd{opacity:1;color:#9fb0d8;}
  .ng-logo .ng-kbd span{color:inherit;}
  @keyframes ngSpin{to{transform:rotate(360deg);}}
  @keyframes ngCount{from{transform:scaleX(1);}to{transform:scaleX(0);}}
  @keyframes ngCardIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes ngDeckExpire{0%{filter:grayscale(0) brightness(1);opacity:1;}55%{filter:grayscale(.35) brightness(.92);opacity:.92;}100%{filter:grayscale(1) brightness(.5);opacity:.34;}}
  @keyframes ngPulseChip{0%,100%{box-shadow:0 0 0 0 rgba(120,170,255,.5);}50%{box-shadow:0 0 0 6px rgba(120,170,255,0);}}
  .ngAcctChip{background:rgba(26,30,52,.66);backdrop-filter:blur(8px);border:1px solid rgba(150,170,210,.2);border-radius:999px;transition:background .2s ease,border-color .2s ease,backdrop-filter .2s ease;}
  .ng-account-menu{position:absolute;right:0;bottom:calc(100% + 10px);width:224px;flex-direction:column;background:linear-gradient(180deg,rgba(26,30,52,.99),rgba(18,21,38,.99));border:1px solid rgba(130,150,190,.22);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.55);padding:5px;animation:ngCardIn .18s ease both;}
  .ngSignupCta{cursor:pointer;font-size:11.5px;font-weight:700;color:#fff;background:linear-gradient(135deg,#4a6cff,#6a5cff);border-radius:999px;padding:8px 14px;box-shadow:0 3px 14px rgba(74,108,255,.42);white-space:nowrap;letter-spacing:.01em;transition:filter .15s ease,transform .15s ease,box-shadow .15s ease;}
  .ngSignupCta:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 5px 18px rgba(74,108,255,.5);}
  *{scrollbar-width:thin;scrollbar-color:rgba(120,150,210,.32) transparent;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(120,150,210,.28);border-radius:8px;border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(150,180,255,.5);border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-corner{background:transparent;}
  /* ---------- responsive ---------- */
  @media (max-width:1023px){
    .ng-drill{width:min(360px,88vw)!important;}
  }
  @media (max-width:640px){
    .ng-logo{top:22px!important;left:18px!important;gap:0!important;}
    .ng-acctwrap{top:auto!important;bottom:28px!important;right:14px!important;} /* the pill's old band seat (v1.99.0) */
    .ngAcctChip{padding:7px!important;} /* avatar-only chip still makes a 44px touch target */
    .ng-logo .ng-word,.ng-logo .ng-kbd{display:none!important;}
    .ng-drill{width:88vw!important;}
    .ngAcctChip>span:first-child{display:none!important;}
    .ngSignupCta{display:none!important;}
    .ng-evtoast{width:86vw!important;}
    .ng-optionrow{padding:10px 12px 6px!important;gap:9px!important;}
    .ng-legendkey{display:none!important;}
    .ng-winbar{width:104px!important;}
    .ng-legend{left:14px!important;bottom:27px!important;gap:0!important;}
  }
</style>
<script src="technique-content.js"></script>
</helmet>
<div ref="{{ wrapRef }}" style="position:fixed;inset:0;background:#1a1a2e;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;cursor:grab;touch-action:none;">
  <canvas ref="{{ canvasRef }}" style="position:absolute;inset:0;display:block;width:100%;height:100%;"></canvas>

  <!-- semantic zoom: the dossier lives inside the node once you zoom close enough -->
  <!-- in-node dossier card. z-index 5 (was 3) is LOAD-BEARING: the card is centred on the node
       and its action row reaches the bottom-centre transport pill (z-index 4), which then
       intercepted every mouse click on "Roll from here" / "Add to today's class list" — the
       card was visible, enabled, stable, and dead to the mouse. Keyboard paths masked it, the
       same way they masked the coach button before v1.69.1. -->
  <div ref="{{ nodeCardRef }}" style="display:none;position:absolute;left:0;top:0;width:560px;height:560px;z-index:5;transform-origin:50% 50%;will-change:transform,opacity;pointer-events:none;"></div>

  <div ref="{{ loaderRef }}" role="status" aria-live="polite" style="position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;pointer-events:none;">
    <div style="width:26px;height:26px;border:2px solid rgba(255,255,255,.15);border-top-color:rgba(120,160,255,.9);border-radius:50%;animation:ngSpin .9s linear infinite;"></div>
    <div style="font-size:11px;font-weight:600;letter-spacing:.06em;color:#8b97b0;">Loading the graph&#8230;</div>
  </div>

  <!-- dominance flash overlay -->
  <div ref="{{ fxRef }}" style="position:absolute;inset:0;pointer-events:none;opacity:0;"></div>


  <!-- modal overlay (settings / legal / auth / search). Z LADDER (see helmet.html): a
       DELIBERATE screen at 95, top of the root overlay plane. Rendered here for the refs but
       PORTALED to the app root at boot — the fixed wrap is its own stacking context, so a
       modal left inside it loses to every root-level ambient overlay (the landing card at z:5
       painted over this very element when it wore z:9 in here). The scrim is inset:0 +
       pointer-events:auto, so while it is up no click reaches the gameplay overlays below. -->
  <div ref="{{ modalRef }}" class="ng-modal" style="display:none;position:fixed;inset:0;z-index:95;background:rgba(8,9,16,.6);backdrop-filter:blur(3px);align-items:center;justify-content:center;pointer-events:auto;">
    <div ref="{{ modalCardRef }}" style="width:min(440px,90vw);background:linear-gradient(180deg,rgba(26,30,52,.99),rgba(18,21,38,.99));border:1px solid rgba(130,150,190,.2);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.65);overflow:hidden;animation:ngCardIn .28s ease both;"></div>
  </div>


  <!-- THE DRAWER OPENER (owner A5 / U46, v1.242.0): one drawer icon, no "Menu" label, no wordmark —
       the brand lives in the open drawer's head. The dot is today's owed reviews (`_paintDrawerDot`).
       Hidden while the drawer is open: the drawer's own head carries the close icon there. -->
  <button type="button" aria-label="Open the sidebar" title="Open the sidebar (/)" class="ng-logo" onClick="{{ toggleExplorer }}" style="position:absolute;top:18px;left:22px;pointer-events:auto;cursor:pointer;z-index:9;border:0;background:transparent;padding:0;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#cbd4e6;">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"></rect><path d="M9.5 4.5v15"></path></svg>
    <span data-drawer-dot="1" style="display:none;position:absolute;top:9px;right:8px;width:8px;height:8px;border-radius:50%;background:#e9bd70;box-shadow:0 0 0 2px #10131f;"></span>
  </button>

  <!-- transport controls (bottom center) -->
  <!-- THE TRANSPORT IS RETIRED (v1.134.0, owner): with the hesitation branch gone the game is
       fully turn-based — nothing advances without a commit, so play/pause/restart controlled
       nothing a player needed. The question clock never pauses (that is the test); restart is
       free roam (background click twice) + click any node. -->

  <!-- mobile dossier sheet: drops from the top, leaves options + win bar + drill row visible below -->
  <div ref="{{ dossierSheetRef }}" style="display:none;position:absolute;top:0;left:0;right:0;height:70%;z-index:8;background:linear-gradient(180deg,rgba(18,21,38,.985),rgba(13,15,28,.985));border-bottom:1px solid rgba(130,150,190,.24);border-radius:0 0 20px 20px;box-shadow:0 20px 54px rgba(0,0,0,.55);overflow-y:auto;pointer-events:auto;padding-top:44px;box-sizing:border-box;transform:translateY(-102%);transition:transform .34s cubic-bezier(.2,.7,.2,1);"></div>

  <!-- event toast (top of play area) -->
  <div ref="{{ evRef }}" class="ng-evtoast" style="position:absolute;top:30px;left:50%;transform:translateX(-50%);pointer-events:none;opacity:0;transition:opacity .45s ease;text-align:center;width:min(540px,64vw);">
    <div ref="{{ evKickerRef }}" style="font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;font-weight:700;color:#7b97aa;margin-bottom:7px;">&nbsp;</div>
    <!-- 18px here is a FIRST-FRAME GUESS ONLY: `_applyTypeScale` (app.src.jsx) overwrites it from
         `announcerPx()` on the first resize, because the phone step (15px) is a breakpoint this
         inline style cannot carry and this file's own <helmet> is stripped by build.mjs. It was
         22px until v1.138.0, which made the transient status line LARGER than the name of the
         node the page is about — the one thing on screen that must outrank it. -->
    <div ref="{{ evTextRef }}" style="font-size:18px;font-weight:600;color:#eef1f6;letter-spacing:-.01em;line-height:1.2;text-shadow:0 2px 14px rgba(0,0,0,.55);">&nbsp;</div>
  </div>

  <!-- options tray (bottom of play area).
       THE TOP PADDING IS PART OF THE GAP ABOVE IT: the landing card docks off this row's
       MEASURED height (`_landDatum`), and the row is anchored by its own `bottom`, so air
       reserved here pushes the card up while "Your options" — which sits just inside this
       padding — stays exactly where it is. 14 -> 8 closed 6px of that band with nothing
       else on screen moving (owner: the card and the choices "should be a little bit
       tighter but not go on top of the row that says Your options"). The cards' hover
       lift is 2px and the title clears them, so 8 is still headroom under `overflow-y:hidden`. -->
  <div ref="{{ optionsRef }}" class="ng-optionrow" style="position:absolute;bottom:84px;left:0;right:0;z-index:4;pointer-events:none;display:flex;gap:12px;align-items:flex-end;justify-content:safe center;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:8px 24px 8px;-webkit-overflow-scrolling:touch;"></div>
  <!-- (the "see more →" hint that docked above the tray, v1.123.0, was DELETED in v1.171.1 — owner) -->

  <!-- SHARE CUE (v1.99.0) — a standalone conditional control in the thumb band. The
       .ng-drilltab pill that used to host it is DELETED (owner: it must not appear on any
       form factor); the pane opener is the LOGO alone, and the account chip holds the
       bottom-right corner on every viewport. Rendered ONLY while a share cue exists
       (_renderShareCue): the ◉ re-light + "Class ▸" pair, or the stale/broken opener.
       Sits ABOVE the chip so neither covers the other; pointer-events:auto inline (fixed
       overlay canon); hidden while the pane is open (the drawer owns that corner). -->
  <!-- v1.242.0: the account chip moved into the drawer (the badge), so the cue takes the chip's old seat. -->
  <div ref="{{ shareCueRef }}" class="ng-sharecue" style="display:none;position:absolute;bottom:24px;right:24px;z-index:6;pointer-events:auto;align-items:center;">
  </div>

  <!-- learning pane (LEFT, v1.94.0 — it opens from the top-left logo, so it lives on the
       logo's side): Explore | Challenges | History — the single side pane.
       Carries BOTH classes: .ng-drill (pane rails + drilltab specs) and .ng-explorer
       (learning-panel visibility specs). Visibility is display-based (flex/none). -->
  <div ref="{{ drillRef }}" class="ng-drill ng-explorer" role="complementary" aria-label="Sidebar" style="display:none;position:absolute;top:0;left:0;bottom:0;width:360px;z-index:8;background:linear-gradient(180deg,rgba(18,21,38,.985),rgba(13,15,28,.985));border-right:1px solid rgba(130,150,190,.16);box-shadow:14px 0 44px rgba(0,0,0,.5);flex-direction:column;pointer-events:auto;">
    <!-- THE DRAWER HEAD (owner A5/E1, v1.242.0). The tab nav is gone: Explore, Train (Practice ·
         Path), your lists and Last rolls are ONE list (renderExplorer). The brand is the way home
         from Path or Last rolls ("‹ Path"), so it carries `data-view="explore"` (_paintDrawerHead). -->
    <div class="ng-drawer-head">
      <button ref="{{ viewToggleRef }}" type="button" data-view="explore" class="ng-drawer-brand" onClick="{{ drawerHome }}"></button>
      <button onClick="{{ closeDeck }}" class="ng-explorer-close" type="button" title="Close panel" aria-label="Close panel"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"></rect><path d="M9.5 4.5v15"></path></svg></button>
    </div>
    <!-- the GI/NO-GI pill moved to Settings -> Rolling (v1.95.3, owner: one home only) -->
    <div ref="{{ explorerToolsRef }}" class="ng-explorer-tools">
      <div ref="{{ explorerSearchWrapRef }}" class="ng-explorer-search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8b97b0" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input ref="{{ explorerSearchRef }}" placeholder="Search techniques&hellip;" style="flex:1;min-width:0;font-family:inherit;font-size:13px;color:#eef1f6;background:transparent;border:none;outline:none;">
      </div>
    </div>
    <div ref="{{ explorerListRef }}" class="ng-learning-list" style="flex:1;overflow-y:auto;padding:4px 12px 24px;"></div>
    <div ref="{{ dossierRef }}" style="display:none;flex:1;min-height:0;overflow-y:auto;position:relative;"></div>
    <div ref="{{ drillHeadRef }}" class="ng-pane-drillhead" style="display:none;padding:4px 24px 16px;border-bottom:1px solid rgba(150,170,210,.1);flex:none;"></div>
    <div ref="{{ drillListRef }}" style="display:none;flex:1;overflow-y:auto;padding:14px 24px 14px;flex-direction:column;gap:10px;"></div>
    <div ref="{{ drillFootRef }}" style="display:none;flex:none;padding:12px 24px 16px;border-top:1px solid rgba(150,170,210,.1);background:rgba(15,17,30,.55);flex-direction:column;gap:9px;"></div>
    <!-- THE BADGE (owner U46 b, v1.242.0): inside the drawer, and it shows today before it is opened
         ("today: 12 of 20 cards · 2 rolls"). Its menu is short (renderAccountMenu); the stat row, the
         guest save block and the feedback/legal foot that lived here moved into it. -->
    <div ref="{{ accountRef }}" class="ng-acctwrap">
      <div ref="{{ acctMenuRef }}" class="ng-account-menu" role="menu" aria-label="Account" style="display:none;pointer-events:auto;"></div>
      <button ref="{{ acctChipRef }}" type="button" class="ngAcctChip" aria-haspopup="menu" aria-expanded="false" onClick="{{ toggleAccountMenu }}">
        <span class="ng-badge-av" aria-hidden="true">G</span><span class="ng-badge-who"><b>Guest</b><small data-badge-today="1"></small></span>
      </button>
      <button ref="{{ acctCtaRef }}" type="button" class="ngSignupCta" data-badge-save="1" onClick="{{ openSignup }}" style="display:none;">Save</button>
    </div>
  </div>

  <!-- round-end verdict (center) -->
  <div ref="{{ evCenterRef }}" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .55s ease;text-align:center;padding:0 24px;">
    <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;">
    <div ref="{{ evcKickerRef }}" style="font-size:13px;letter-spacing:.42em;text-transform:uppercase;font-weight:700;color:#8ba0c0;margin-bottom:14px;">&nbsp;</div>
    <div ref="{{ evcTextRef }}" style="font-size:clamp(40px,6vw,68px);font-weight:700;color:#eef1f6;letter-spacing:-.02em;line-height:1;text-shadow:0 4px 30px rgba(0,0,0,.6);">&nbsp;</div>
    <div ref="{{ evcSubRef }}" style="font-size:16px;font-weight:500;color:#aab4ca;margin-top:16px;letter-spacing:.01em;">&nbsp;</div>
    </div>
  </div>

  <!-- legend (bottom left) -->
  <div class="ng-legend" style="position:absolute;bottom:30px;left:38px;z-index:1;display:flex;flex-direction:column;gap:16px;pointer-events:none;">
    <div ref="{{ legendRef }}" class="ng-legendkey" style="display:flex;flex-direction:column;gap:11px;opacity:0;transition:opacity .6s ease;">
      <div style="display:flex;align-items:center;gap:11px;">
        <span style="width:13px;height:13px;border-radius:50%;background:#c9d2e3;"></span>
        <span style="font-size:12px;color:#aeb6c8;font-weight:500;">Position</span>
      </div>
      <div style="display:flex;align-items:center;gap:11px;">
        <span style="width:11px;height:11px;background:#c9d2e3;transform:rotate(45deg);margin:0 1px;"></span>
        <span style="font-size:12px;color:#aeb6c8;font-weight:500;">Transition</span>
      </div>
      <div style="display:flex;align-items:center;gap:11px;">
        <span style="width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid #c9d2e3;"></span>
        <span style="font-size:12px;color:#aeb6c8;font-weight:500;">Submission</span>
      </div>
      <!-- the EDGE legend row lived here for two versions (v1.133.0 -> v1.135.0) and was
           deleted at the owner's call: "the +7 tilt toward winning looks off … it's over
           designing — the bar already shows that nicely". The EDGE explainer survives where the
           player actually stops: the option sheet's caption. -->
    </div>
    <div class="ng-winbar" style="display:flex;flex-direction:column;gap:6px;width:165px;">
      <div style="height:7px;border-radius:4px;background:linear-gradient(90deg,#4084ff 0%,#8e8e94 50%,#e84040 100%);position:relative;overflow:visible;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);">
        <div ref="{{ legendMarkRef }}" style="position:absolute;top:-4px;bottom:-4px;left:50%;width:2.5px;border-radius:2px;background:#fff;box-shadow:0 0 5px rgba(0,0,0,.6),0 0 3px rgba(255,255,255,.8);transform:translateX(-50%);opacity:0;">
          <span ref="{{ legendPointRef }}" style="position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #fff;"></span>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:10.5px;color:#8b93a8;font-weight:600;letter-spacing:.02em;">
        <span data-legend-win>Win</span><span>Lose</span>
      </div>
    </div>
  </div>


</div>
