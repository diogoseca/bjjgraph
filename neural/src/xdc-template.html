
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Sora:wght@500;600;700&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<link href="challenge-ui.css" rel="stylesheet">
<link href="challenge-collection.css" rel="stylesheet">
<link href="challenge-feedback.css" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;height:100%;background:#1a1a2e;overflow:hidden;}
  *{box-sizing:border-box;}
  @keyframes ngFadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes ngHintFade{0%{opacity:0;}12%,68%{opacity:.5;}100%{opacity:0;}}
  @keyframes ngIntroLife{0%{opacity:0;transform:translateY(10px);}20%{opacity:1;transform:translateY(0);}77%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(0);}}
  .ng-optionrow{-ms-overflow-style:none;scrollbar-width:none;mask-image:linear-gradient(90deg,transparent 0,#000 36px,#000 calc(100% - 36px),transparent 100%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 36px,#000 calc(100% - 36px),transparent 100%);scroll-padding:0 28px;}
  .ng-optionrow::-webkit-scrollbar{height:0;display:none;}
  .ng-optionrow > *{scroll-snap-align:center;}
  .ng-logo:hover span{color:#fff;}
  .ng-logo:hover .ng-kbd{opacity:1;color:#9fb0d8;}
  .ng-logo .ng-kbd span{color:inherit;}
  @keyframes ngSpin{to{transform:rotate(360deg);}}
  @keyframes ngCount{from{transform:scaleX(1);}to{transform:scaleX(0);}}
  @keyframes ngCardIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes ngDeckExpire{0%{filter:grayscale(0) brightness(1);opacity:1;}55%{filter:grayscale(.35) brightness(.92);opacity:.92;}100%{filter:grayscale(1) brightness(.5);opacity:.34;}}
  @keyframes ngPulseChip{0%,100%{box-shadow:0 0 0 0 rgba(120,170,255,.5);}50%{box-shadow:0 0 0 6px rgba(120,170,255,0);}}
  .ngAcctChip{background:rgba(26,30,52,.66);backdrop-filter:blur(8px);border:1px solid rgba(150,170,210,.2);border-radius:999px;transition:background .2s ease,border-color .2s ease,backdrop-filter .2s ease;}
  .ng-account-menu{position:absolute;right:0;bottom:calc(100% + 10px);width:224px;flex-direction:column;background:linear-gradient(180deg,rgba(26,30,52,.99),rgba(18,21,38,.99));border:1px solid rgba(130,150,190,.22);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.55);padding:5px;animation:ngCardIn .18s ease both;}
  .ngSignupCta{cursor:pointer;font-size:11.5px;font-weight:700;color:#fff;background:linear-gradient(135deg,#4a6cff,#6a5cff);border-radius:999px;padding:8px 14px;box-shadow:0 3px 14px rgba(74,108,255,.42);white-space:nowrap;letter-spacing:.01em;transition:filter .15s ease,transform .15s ease,box-shadow .15s ease;}
  .ngSignupCta:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 5px 18px rgba(74,108,255,.5);}
  *{scrollbar-width:thin;scrollbar-color:rgba(120,150,210,.32) transparent;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(120,150,210,.28);border-radius:8px;border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(150,180,255,.5);border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-corner{background:transparent;}
  /* ---------- responsive ---------- */
  @media (max-width:1023px){
    .ng-drill{width:min(360px,88vw)!important;}
  }
  @media (max-width:640px){
    .ng-logo{top:22px!important;left:18px!important;gap:0!important;}
    .ng-acctwrap{top:auto!important;bottom:28px!important;right:14px!important;} /* the pill's old band seat (v1.99.0) */
    .ngAcctChip{padding:7px!important;} /* avatar-only chip still makes a 44px touch target */
    .ng-logo .ng-word,.ng-logo .ng-kbd{display:none!important;}
    .ng-intro{top:54px!important;left:16px!important;}
    .ng-intro>div:first-child{font-size:21px!important;}
    .ng-intro>div:last-child{font-size:12px!important;max-width:228px!important;margin-top:8px!important;}
    .ng-drill{width:88vw!important;}
    .ngAcctChip>span:first-child{display:none!important;}
    .ngSignupCta{display:none!important;}
    .ng-evtoast{width:86vw!important;}
    .ng-optionrow{padding:10px 12px 6px!important;gap:9px!important;}
    .ng-legendkey{display:none!important;}
    .ng-seemore{display:none!important;}
    .ng-winbar{width:104px!important;}
    .ng-legend{left:14px!important;bottom:27px!important;gap:0!important;}
  }
</style>
<script src="technique-content.js"></script>
</helmet>
<div ref="{{ wrapRef }}" style="position:fixed;inset:0;background:#1a1a2e;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;cursor:grab;touch-action:none;">
  <canvas ref="{{ canvasRef }}" style="position:absolute;inset:0;display:block;width:100%;height:100%;"></canvas>

  <!-- semantic zoom: the dossier lives inside the node once you zoom close enough -->
  <!-- in-node dossier card. z-index 5 (was 3) is LOAD-BEARING: the card is centred on the node
       and its action row reaches the bottom-centre transport pill (z-index 4), which then
       intercepted every mouse click on "Roll from here" / "Add to today's class list" — the
       card was visible, enabled, stable, and dead to the mouse. Keyboard paths masked it, the
       same way they masked the coach button before v1.69.1. -->
  <div ref="{{ nodeCardRef }}" style="display:none;position:absolute;left:0;top:0;width:560px;height:560px;z-index:5;transform-origin:50% 50%;will-change:transform,opacity;pointer-events:none;"></div>

  <div ref="{{ loaderRef }}" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
    <div style="width:26px;height:26px;border:2px solid rgba(255,255,255,.15);border-top-color:rgba(120,160,255,.9);border-radius:50%;animation:ngSpin .9s linear infinite;"></div>
  </div>

  <!-- dominance flash overlay -->
  <div ref="{{ fxRef }}" style="position:absolute;inset:0;pointer-events:none;opacity:0;"></div>

  <!-- account chip (bottom-right) + its compact menu (v1.94.0). The chip opens the MENU, not
       the pane — the pane opener is the top-left logo. pointer-events:auto INLINE on both: the
       wrap and the menu are fixed overlays over the canvas hit-test. -->
  <div ref="{{ accountRef }}" class="ng-acctwrap" style="position:absolute;bottom:24px;right:24px;pointer-events:auto;z-index:6;transition:opacity .25s ease;">
    <div ref="{{ acctMenuRef }}" class="ng-account-menu" role="menu" aria-label="Account" style="display:none;pointer-events:auto;"></div>
    <div ref="{{ acctChipRef }}" class="ngAcctChip" role="button" tabindex="0" aria-haspopup="menu" aria-expanded="false" aria-label="Account menu" onClick="{{ toggleAccountMenu }}" style="cursor:pointer;display:flex;align-items:center;gap:10px;padding:5px 7px 5px 14px;">
      <span style="font-size:12px;font-weight:600;color:#cbd4e6;letter-spacing:.01em;">Guest</span>
      <span style="width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#4a6cff,#9a5cff);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;box-shadow:0 2px 10px rgba(74,108,255,.4);">G</span>
    </div>
  </div>

  <!-- modal overlay (settings / legal / auth / search). Z LADDER (see helmet.html): a
       DELIBERATE screen at 95, top of the root overlay plane. Rendered here for the refs but
       PORTALED to the app root at boot — the fixed wrap is its own stacking context, so a
       modal left inside it loses to every root-level ambient overlay (the landing card at z:5
       painted over this very element when it wore z:9 in here). The scrim is inset:0 +
       pointer-events:auto, so while it is up no click reaches the gameplay overlays below. -->
  <div ref="{{ modalRef }}" class="ng-modal" style="display:none;position:fixed;inset:0;z-index:95;background:rgba(8,9,16,.6);backdrop-filter:blur(3px);align-items:center;justify-content:center;pointer-events:auto;">
    <div ref="{{ modalCardRef }}" style="width:min(440px,90vw);background:linear-gradient(180deg,rgba(26,30,52,.99),rgba(18,21,38,.99));border:1px solid rgba(130,150,190,.2);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.65);overflow:hidden;animation:ngCardIn .28s ease both;"></div>
  </div>

  <!-- brand: revamped dice-graph logo + wordmark (top-left, persistent) -->
  <button type="button" aria-label="Open learning panel" class="ng-logo" onClick="{{ toggleExplorer }}" style="position:absolute;top:24px;left:34px;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:10px;z-index:9;border:0;background:transparent;padding:0;text-align:left;font-family:inherit;">
    <span class="ng-logo-mark" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="2.5"></circle><circle cx="18" cy="7" r="2.5"></circle><circle cx="11" cy="18" r="2.5"></circle><path d="m8.2 7.3 7.4-.2M7.3 8.2l2.5 7.4m6.5-6.4-3.8 6.7"></path></svg></span>
    <div style="display:flex;flex-direction:column;gap:3px;">
      <span ref="{{ brandFontRef }}" class="ng-word" style="font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:500;letter-spacing:-.005em;color:#cbd4e6;line-height:1;transition:opacity .9s ease,color .2s;">bjjgraph<span style="color:#6b7691;">.org</span></span>
      <span class="ng-kbd" style="display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:600;color:#6b7691;background:transparent;border-radius:6px;padding:1px 0 0;letter-spacing:.03em;width:max-content;opacity:.6;transition:opacity .2s,color .2s;">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>Open panel <span style="opacity:.65;font-weight:700;">/</span>
      </span>
    </div>
  </button>

  <!-- transport controls (bottom center) -->
  <div ref="{{ transportRef }}" class="ng-transport" data-transport="1" style="position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:4;pointer-events:auto;display:flex;align-items:center;gap:6px;background:rgba(24,28,48,.66);backdrop-filter:blur(8px);border:1px solid rgba(150,170,210,.16);border-radius:999px;padding:5px 7px;">
    <button ref="{{ playPauseRef }}" data-transport-play="1" aria-label="Play or pause the roll" onClick="{{ togglePause }}" title="Pause" style="cursor:pointer;width:34px;height:34px;border:none;border-radius:50%;background:rgba(255,255,255,.08);color:#eef1f6;display:flex;align-items:center;justify-content:center;padding:0;"></button>
    <button onClick="{{ resetRoll }}" data-transport-restart="1" aria-label="Restart the roll" title="Restart roll" style="cursor:pointer;width:34px;height:34px;border:none;border-radius:50%;background:transparent;color:#aeb6c8;display:flex;align-items:center;justify-content:center;padding:0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg></button>
  </div>

  <!-- persistent status HUD (top-left, after intro) -->
  <div class="ng-intro" style="position:absolute;top:72px;left:36px;pointer-events:none;animation:ngIntroLife 6.5s cubic-bezier(.2,.7,.2,1) .4s both;">
    <div style="font-size:28px;font-weight:700;color:#eef1f6;letter-spacing:-.01em;line-height:1.05;">Roll the graph.</div>
    <div style="font-size:13px;color:#9aa3b8;margin-top:11px;max-width:300px;line-height:1.5;font-weight:400;">A live roll plays out across the map. Choose your move, or let it flow.</div>
  </div>

  <!-- mobile dossier sheet: drops from the top, leaves options + win bar + drill row visible below -->
  <div ref="{{ dossierSheetRef }}" style="display:none;position:absolute;top:0;left:0;right:0;height:70%;z-index:8;background:linear-gradient(180deg,rgba(18,21,38,.985),rgba(13,15,28,.985));border-bottom:1px solid rgba(130,150,190,.24);border-radius:0 0 20px 20px;box-shadow:0 20px 54px rgba(0,0,0,.55);overflow-y:auto;pointer-events:auto;padding-top:44px;box-sizing:border-box;transform:translateY(-102%);transition:transform .34s cubic-bezier(.2,.7,.2,1);"></div>

  <!-- event toast (top of play area) -->
  <div ref="{{ evRef }}" class="ng-evtoast" style="position:absolute;top:30px;left:50%;transform:translateX(-50%);pointer-events:none;opacity:0;transition:opacity .45s ease;text-align:center;width:min(540px,64vw);">
    <div ref="{{ evKickerRef }}" style="font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;font-weight:700;color:#7b97aa;margin-bottom:7px;">&nbsp;</div>
    <div ref="{{ evTextRef }}" style="font-size:22px;font-weight:600;color:#eef1f6;letter-spacing:-.01em;line-height:1.2;text-shadow:0 2px 14px rgba(0,0,0,.55);">&nbsp;</div>
  </div>

  <!-- options tray (bottom of play area) -->
  <div ref="{{ optionsRef }}" class="ng-optionrow" style="position:absolute;bottom:84px;left:0;right:0;z-index:4;pointer-events:none;display:flex;gap:12px;align-items:flex-end;justify-content:safe center;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:14px 24px 8px;-webkit-overflow-scrolling:touch;"></div>
  <!-- "see more" docks ABOVE the tray (v1.123.0). `bottom` here is a FIRST-FRAME GUESS only —
       _dockOptionHint overwrites it from the row's measured height, which has no constant. -->
  <div ref="{{ optionHintRef }}" class="ng-seemore" onClick="{{ scrollOptions }}" style="position:absolute;bottom:238px;right:24px;z-index:3;pointer-events:none;cursor:pointer;opacity:0;transition:opacity .55s cubic-bezier(.4,0,.2,1),color .15s;display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:600;letter-spacing:.08em;color:#7e8aa8;text-transform:uppercase;">see more<span style="font-size:11px;display:inline-block;">&rarr;</span></div>

  <!-- option detail: a bottom sheet that expands in place (no dimming overlay) -->
  <div ref="{{ optDetailRef }}" style="position:absolute;left:0;right:0;bottom:0;margin:0 auto;width:min(660px,94vw);height:340px;z-index:6;opacity:0;pointer-events:none;transition:opacity .26s cubic-bezier(.2,.7,.2,1),transform .34s cubic-bezier(.2,.7,.2,1),height .34s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(27,31,53,.995),rgba(17,20,36,.995));border:1px solid rgba(130,150,190,.22);border-bottom:none;border-top-left-radius:20px;border-top-right-radius:20px;box-shadow:0 -16px 60px rgba(0,0,0,.55);overflow:hidden;"></div>

  <!-- SHARE CUE (v1.99.0) — a standalone conditional control in the thumb band. The
       .ng-drilltab pill that used to host it is DELETED (owner: it must not appear on any
       form factor); the pane opener is the LOGO alone, and the account chip holds the
       bottom-right corner on every viewport. Rendered ONLY while a share cue exists
       (_renderShareCue): the ◉ re-light + "Class ▸" pair, or the stale/broken opener.
       Sits ABOVE the chip so neither covers the other; pointer-events:auto inline (fixed
       overlay canon); hidden while the pane is open (the drawer owns that corner). -->
  <div ref="{{ shareCueRef }}" class="ng-sharecue" style="display:none;position:absolute;bottom:76px;right:24px;z-index:6;pointer-events:auto;align-items:center;">
  </div>

  <!-- learning pane (LEFT, v1.94.0 — it opens from the top-left logo, so it lives on the
       logo's side): Explore | Challenges | History — the single side pane.
       Carries BOTH classes: .ng-drill (pane rails + drilltab specs) and .ng-explorer
       (learning-panel visibility specs). Visibility is display-based (flex/none). -->
  <div ref="{{ drillRef }}" class="ng-drill ng-explorer" role="complementary" aria-label="Explore, Challenges, and Last rolls" style="display:none;position:absolute;top:0;left:0;bottom:0;width:360px;z-index:8;background:linear-gradient(180deg,rgba(18,21,38,.985),rgba(13,15,28,.985));border-right:1px solid rgba(130,150,190,.16);box-shadow:14px 0 44px rgba(0,0,0,.5);flex-direction:column;pointer-events:auto;">
    <button onClick="{{ closeDeck }}" class="ng-explorer-close" type="button" title="Close panel" aria-label="Close panel">&times;</button>
    <!-- the knowledge header is GONE (v1.96.0): the woven belt + road + "N% to blue" live at
         the top of Explore's body (_knowledgeBlock), merged with the stats row — the tab
         subtitles made a header above the tabs a triple statement of the same fact. -->
    <!-- two-line tabs (v1.95.0): title <b> + subtitle <small> (filled by renderTabSubtitles;
         the history line is static). "Last rolls" is DISPLAY only — the view id, settings
         keys and every internal seam stay `history` (migration cost not worth it). -->
    <nav ref="{{ viewToggleRef }}" class="ng-learning-nav" aria-label="Learning views">
      <button type="button" data-view="explore" aria-pressed="false"><b>Explore</b><small data-tab-sub="explore"></small></button>
      <button type="button" data-view="challenges" aria-pressed="true"><b>Challenges</b><small data-tab-sub="challenges"></small></button>
      <button type="button" data-view="history" aria-pressed="false"><b>Last rolls</b><small data-tab-sub="history">Your last rolls</small></button>
    </nav>
    <!-- the GI/NO-GI pill moved to Settings -> Rolling (v1.95.3, owner: one home only) -->
    <div ref="{{ explorerToolsRef }}" class="ng-explorer-tools">
      <div ref="{{ explorerSearchWrapRef }}" class="ng-explorer-search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8b97b0" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input ref="{{ explorerSearchRef }}" placeholder="Search techniques&hellip;" style="flex:1;min-width:0;font-family:inherit;font-size:13px;color:#eef1f6;background:transparent;border:none;outline:none;">
      </div>
    </div>
    <div ref="{{ explorerListRef }}" class="ng-learning-list" style="flex:1;overflow-y:auto;padding:4px 12px 24px;"></div>
    <div ref="{{ dossierRef }}" style="display:none;flex:1;min-height:0;overflow-y:auto;position:relative;"></div>
    <div ref="{{ drillHeadRef }}" class="ng-pane-drillhead" style="display:none;padding:64px 64px 16px 24px;border-bottom:1px solid rgba(150,170,210,.1);flex:none;"></div>
    <div ref="{{ drillListRef }}" style="display:none;flex:1;overflow-y:auto;padding:14px 24px 14px;flex-direction:column;gap:10px;"></div>
    <div ref="{{ drillFootRef }}" style="display:none;flex:none;padding:12px 24px 16px;border-top:1px solid rgba(150,170,210,.1);background:rgba(15,17,30,.55);flex-direction:column;gap:9px;"></div>
    <!-- pane anchor (v1.93.0): stats row + guest save nudge, ONE block at the pane's bottom,
         visible on all three tabs (hidden only while a study surface owns the pane). -->
    <!-- v1.104.5: the stat band lives at the pane FOOT (owner), as its OWN element ABOVE the
         save nudge — the anchor collapses entirely when signed in, and the stats must not. -->
    <div ref="{{ paneStatsRef }}" class="ng-pane-stats" style="flex:none;display:none;border-top:1px solid rgba(150,170,210,.1);"></div>
    <div ref="{{ paneAnchorRef }}" class="ng-pane-anchor" style="flex:none;display:flex;flex-direction:column;gap:2px;padding:12px 24px 0;border-top:1px solid rgba(150,170,210,.1);background:rgba(15,17,30,.35);"></div>
    <!-- v1.105.5 (owner): feedback goes to POSTHOG, not GitHub issues — plus a GitHub chip with
         the repo's stars (fetched lazily, cached a day; plain link when the count is unknown). -->
    <div class="ng-pane-feedback" style="flex:none;display:flex;justify-content:center;align-items:center;gap:14px;padding:10px 24px 0;background:rgba(15,17,30,.35);">
      <span onClick="{{ openFeedbackTechnique }}" data-feedback="technique" style="cursor:pointer;font-size:10.5px;color:#5d6883;letter-spacing:.02em;" style-hover="color:#9aa6bd;">Request a technique</span>
      <span style="width:3px;height:3px;border-radius:50%;background:#3c4358;"></span>
      <span onClick="{{ openFeedbackIssue }}" data-feedback="issue" style="cursor:pointer;font-size:10.5px;color:#5d6883;letter-spacing:.02em;" style-hover="color:#9aa6bd;">Report an issue</span>
      <span style="width:3px;height:3px;border-radius:50%;background:#3c4358;"></span>
      <a ref="{{ ghChipRef }}" data-gh-chip="1" href="https://github.com/diogoseca/bjjgraph" target="_blank" rel="noopener" style="pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:#5d6883;text-decoration:none;letter-spacing:.02em;" style-hover="color:#9aa6bd;"><svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"></path></svg><span data-gh-label="1">GitHub</span></a>
    </div>
    <div style="flex:none;display:flex;justify-content:center;align-items:center;gap:14px;padding:12px 24px 14px;background:rgba(15,17,30,.35);">
      <span onClick="{{ openSettings }}" title="Settings" style="cursor:pointer;color:#5d6883;display:flex;align-items:center;" style-hover="color:#9aa6bd;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path></svg></span>
      <span style="width:3px;height:3px;border-radius:50%;background:#3c4358;"></span>
      <span onClick="{{ openTerms }}" style="cursor:pointer;font-size:10.5px;color:#5d6883;letter-spacing:.02em;" style-hover="color:#9aa6bd;">Terms</span>
      <span style="width:3px;height:3px;border-radius:50%;background:#3c4358;"></span>
      <span onClick="{{ openPrivacy }}" style="cursor:pointer;font-size:10.5px;color:#5d6883;letter-spacing:.02em;" style-hover="color:#9aa6bd;">Privacy</span>
    </div>
  </div>

  <!-- round-end verdict (center) -->
  <div ref="{{ evCenterRef }}" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .55s ease;text-align:center;padding:0 24px;">
    <div ref="{{ evcKickerRef }}" style="font-size:13px;letter-spacing:.42em;text-transform:uppercase;font-weight:700;color:#8ba0c0;margin-bottom:14px;">&nbsp;</div>
    <div ref="{{ evcTextRef }}" style="font-size:clamp(40px,6vw,68px);font-weight:700;color:#eef1f6;letter-spacing:-.02em;line-height:1;text-shadow:0 4px 30px rgba(0,0,0,.6);">&nbsp;</div>
    <div ref="{{ evcSubRef }}" style="font-size:16px;font-weight:500;color:#aab4ca;margin-top:16px;letter-spacing:.01em;">&nbsp;</div>
  </div>

  <!-- legend (bottom left) -->
  <div class="ng-legend" style="position:absolute;bottom:30px;left:38px;z-index:1;display:flex;flex-direction:column;gap:16px;pointer-events:none;">
    <div ref="{{ legendRef }}" class="ng-legendkey" style="display:flex;flex-direction:column;gap:11px;opacity:0;transition:opacity .6s ease;">
      <div style="display:flex;align-items:center;gap:11px;">
        <span style="width:13px;height:13px;border-radius:50%;background:#c9d2e3;"></span>
        <span style="font-size:12px;color:#aeb6c8;font-weight:500;">Position</span>
      </div>
      <div style="display:flex;align-items:center;gap:11px;">
        <span style="width:11px;height:11px;background:#c9d2e3;transform:rotate(45deg);margin:0 1px;"></span>
        <span style="font-size:12px;color:#aeb6c8;font-weight:500;">Transition</span>
      </div>
      <div style="display:flex;align-items:center;gap:11px;">
        <span style="width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid #c9d2e3;"></span>
        <span style="font-size:12px;color:#aeb6c8;font-weight:500;">Submission</span>
      </div>
    </div>
    <div class="ng-winbar" style="display:flex;flex-direction:column;gap:7px;width:210px;">
      <div style="height:9px;border-radius:5px;background:linear-gradient(90deg,#e84040 0%,#8e8e94 50%,#4084ff 100%);position:relative;overflow:visible;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);">
        <div ref="{{ legendMarkRef }}" style="position:absolute;top:-4px;bottom:-4px;left:50%;width:2.5px;border-radius:2px;background:#fff;box-shadow:0 0 5px rgba(0,0,0,.6),0 0 3px rgba(255,255,255,.8);transform:translateX(-50%);opacity:0;">
          <span ref="{{ legendPointRef }}" style="position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #fff;"></span>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:10.5px;color:#8b93a8;font-weight:600;letter-spacing:.02em;">
        <span>Lose</span><span>Win</span>
      </div>
    </div>
  </div>


</div>
