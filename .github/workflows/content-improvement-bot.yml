name: Content Improvement Bot

on:
  schedule:
    # Run once daily at 8:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      num_files:
        description: 'Number of files to improve (default: 2)'
        required: false
        default: '2'

jobs:
  improve-content:
    runs-on: ubuntu-latest
    concurrency:
      group: content-improvement-bot
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select oldest files to improve
        id: select_files
        run: |
          chmod +x ./scripts/select_oldest_files.sh
          # Run script with custom number of files (default 2)
          NUM_FILES=${{ github.event.inputs.num_files || '2' }}
          echo "Selecting $NUM_FILES files from the 100 oldest..."

          # Get the files and save to environment
          SELECTED_FILES=$(./scripts/select_oldest_files.sh "$NUM_FILES")
          echo "selected_files<<EOF" >> $GITHUB_OUTPUT
          echo "$SELECTED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Log for visibility
          echo "Selected files:"
          echo "$SELECTED_FILES"

      - name: Prepare PAA context with Claude
        id: prepare_paa
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are a BJJ SEO analyst preparing "People Also Ask" (PAA) context for content improvement.

            # Your Mission
            For each selected article below, fetch PAA data from Google SERP using the DataForSEO MCP server and prepare structured context for the next improvement step.

            # Selected Articles
            ${{ steps.select_files.outputs.selected_files }}

            # Process for Each Article

            1. **Extract Seed Keyword**
               - Read the article file
               - Extract title from YAML frontmatter (look for `title:` field)
               - Clean the title to extract main keyword (remove "| BJJ Graph" suffix, "| BJJ Submission" etc.)
               - Fallback: use filename if title not found

            2. **Fetch PAA Data**
               - Use `mcp__dataforseo__serp_organic_live_advanced` tool
               - Parameters:
                 - keyword: extracted seed keyword
                 - location_name: "United States"
                 - language_code: "en"
                 - device: "desktop"
                 - people_also_ask_click_depth: 2
                 - depth: 50
               - Extract PAA questions and any expanded answers

            3. **Extract Current Structure**
               - From the article, extract all H2 (`## `) and H3 (`### `) headings
               - Save as a list for comparison

            4. **Build Context File**
               - For each article, create a JSON file: `paa_context_{filename}.json`
               - Structure:
                 ```json
                 {
                   "article_path": "source/content/...",
                   "seed_keyword": "extracted keyword",
                   "current_sections": ["H2: Section 1", "H3: Subsection 1.1", ...],
                   "paa_questions": [
                     {
                       "question": "What is...",
                       "answer_snippet": "...",
                       "source_url": "..."
                     }
                   ],
                   "analysis_summary": "Brief summary of PAA coverage gaps and opportunities"
                 }
                 ```
               - Save to `/tmp/paa_output/` directory

            5. **Ensure CSV Exists**
               - Check if `todo/suggested_new_files.csv` exists
               - If not, create it with headers: `relative_path,plan`
               - Don't modify contents, just ensure it exists

            # Output Requirements

            - Create `/tmp/paa_output/` directory
            - One JSON context file per article
            - Create `/tmp/paa_output/summary.txt` with:
              - List of processed articles
              - Number of PAA questions found per article
              - Key themes/topics discovered
            - Ensure `todo/suggested_new_files.csv` exists

            Begin processing now. Use the MCP DataForSEO tools to fetch real PAA data.
          claude_args: |
            --mcp-config '{"mcpServers":{"dataforseo":{"command":"npx","args":["-y","@modelcontextprotocol/server-dataforseo"],"env":{"DATAFORSEO_LOGIN":"${{ secrets.DATAFORSEO_LOGIN }}","DATAFORSEO_PASSWORD":"${{ secrets.DATAFORSEO_PASSWORD }}"}}}}'
            --allowedTools 'Read,Write,Glob,Bash(mkdir:*),Bash(ls:*),mcp__dataforseo__serp_organic_live_advanced'

      - name: Improve BJJ content with Claude
        id: improve_content
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are a black-belt BJJ technical documentation bot, SEO expert, and AI search optimization specialist for the BJJ Graph project. Your expertise spans decades of mat experience, technical analysis, and content optimization for both human readers and AI-powered search engines.

            # PAA Context Available
            The previous step has prepared "People Also Ask" data for your selected articles.
            - Check `/tmp/paa_output/` directory for context files
            - Each file contains: seed keyword, current sections, PAA questions, and gap analysis
            - Use PAA insights to:
              - Add missing sections that address common questions
              - Create 2-4 sentence "Answer Capsules" for each major section
              - Improve heading clarity to directly answer questions
              - Front-load key facts in section openings
            - Read `/tmp/paa_output/summary.txt` for an overview

            # New Article Suggestions
            If you identify 1-3 new articles that would fill content gaps (based on PAA or your analysis):
            - Append lines to `todo/suggested_new_files.csv`
            - Format: `relative_path,plan`
            - Example: `source/content/Concepts/Base-and-Posture.md,"Article covering base maintenance and posture principles; sections: definition, biomechanics, common errors, drills; target: beginners; why: referenced in 15+ positions but no dedicated article"`
            - Only suggest high-value articles that don't already exist

            # Your Mission
            Systematically enhance the following pre-selected BJJ technique files with surgical precision, targeting the highest-impact improvements first. These files were selected from the 100 oldest files in the repository to prioritize neglected content.

            # Files to Improve
            ${{ steps.select_files.outputs.selected_files }}

            # Standards to Follow

            Read these contributor guides to understand ALL requirements:
            - source/content/Positions/CONTRIBUTING-POSITIONS.md (Position Standard V2 with Visual Description requirements)
            - source/content/Transitions/CONTRIBUTING-TRANSITIONS.md (Transition Standard V2)
            - source/content/Submissions/CONTRIBUTING-SUBMISSIONS.md (Submission Standard with SAFETY FIRST)
            - source/content/Concepts/CONTRIBUTING-CONCEPTS.md (Concept Standard)
            - source/content/Systems/CONTRIBUTING-SYSTEMS.md (System Standard)
            - source/content/Learning/COnTRIBUTING-LEARNING.md (Learning Resource Standard)
            - source/content/CONTRIBUTING-YAML-SCHEMA.md (Complete schema reference)

            Follow ALL requirements from the appropriate guide for each file type.

            # AI Search Optimization Principles (Microsoft/Bing/Copilot)

            Apply these principles to make content AI-ready for inclusion in search answer boxes:

            **Content Structure for AI:**
            - Use clear, descriptive H2/H3 headings that directly answer questions
            - Break content into short, focused sections (2-4 sentences per paragraph)
            - Lead each section with the most important information first
            - Use definitive, factual language - avoid vague terms like "might," "could," "possibly"
            - Structure content as direct answers to implicit user questions

            **Clarity & Directness:**
            - Write in active voice with concrete, specific statements
            - Define technical terms immediately when first used
            - Use numbered lists for steps/sequences, bulleted lists for features/benefits
            - Avoid large text blocks - max 4-5 sentences per paragraph
            - Front-load key facts in first 1-2 sentences of each section

            **Schema & Structured Data:**
            - Ensure schema markup accurately reflects visible content
            - Keep HowTo steps clear, actionable, and properly sequenced
            - FAQ schema questions should match natural language queries users ask

            **Accessibility for AI Parsing:**
            - Avoid hidden information or content behind interactions
            - Keep important data in main content flow, not footnotes or asides
            - Use consistent terminology throughout (don't vary terms for same concept)
            - Ensure headings create logical content hierarchy

            # Production-Ready Content Requirements

            **REMOVE or FIX immediately if found:**
            - Dev notes like "TODO:", "FIXME:", "XXX:", "HACK:", "NOTE TO DEV"
            - SEO placeholders like "SEO TODO:", "SEO:", "[Add keywords here]"
            - Draft markers: "DRAFT", "WIP", "PLACEHOLDER", "TBD", "Coming soon"
            - Internal references to file paths like `/todo/`, `/docs/` in public-facing content
            - Vague language: "This might work", "Could be effective", "Possibly useful"
            - Unfinished sections with "..." or incomplete sentences

            Content must be publication-ready, polished, and professional with no internal development artifacts visible.

            # Priority Detection & Execution

            As an expert, you know what makes content truly valuable. For each file, detect and prioritize:

            **🔴 HIGH PRIORITY (Fix First):**
            - **Production Issues**: Remove ALL dev notes, TODOs, SEO remarks, draft markers, placeholders
            - **Missing Visual Description** (Positions): If absent or under 400 characters - critical for learner comprehension and AI parsing
            - **Missing/Incomplete Safety Sections** (Submissions): Any submission without comprehensive safety warnings
            - **Missing Execution Steps** (All types): Core technical content must be complete
            - **Vague Language**: Replace conditional/uncertain language with definitive statements
            - **Poor Content Structure**: Break up large paragraphs (>5 sentences), add clear headings

            **🟡 MEDIUM PRIORITY (Enhance Second):**
            - **AI Search Optimization**: Improve heading clarity, front-load key facts, use direct language
            - **Common Errors Format**: Upgrade from 3 errors to comprehensive 5-10 error format with ⚠️ DANGER labels
            - **Expert Insights**: Ensure all three perspectives (Danaher, Gordon Ryan, Eddie Bravo) are present and substantive
            - **FAQ Section**: Add if missing or has fewer than 5 Q&A pairs with natural language questions
            - **Short Sections**: Ensure paragraphs are concise (2-4 sentences), breaking up text walls

            **🟢 STANDARD IMPROVEMENTS (Apply Always):**
            - YAML frontmatter completeness
            - Success rate consistency across skill levels
            - Wikilink accuracy
            - Decision tree logic
            - Training progressions
            - Schema markup accuracy

            # Your Expert Process

            Apply your black-belt judgment to each file:
            1. **Scan for Production Issues** - Check for and remove dev notes, TODOs, SEO remarks, draft markers
            2. **Diagnose** - Read file and identify improvement priorities
            3. **Consult Standards** - Reference appropriate CONTRIBUTING guide for that content type
            4. **Optimize for AI Search** - Apply Microsoft's principles: clear headings, short sections, direct language
            5. **Execute Improvements** - Apply fixes in priority order (HIGH → MEDIUM → STANDARD)
            6. **Update Bot Metadata** - For EVERY file processed, add/update this in YAML frontmatter:
               ```yaml
               bot_metadata:
                 last_improved: "2025-10-19"
               ```
               Use today's date in YYYY-MM-DD format. This MUST be done even if no other changes were made.
            7. **Validate Quality** - Ensure all improvements meet V2 standards and are production-ready

            Remember: You're crafting production-ready, AI-optimized content that serves both human learners and AI search engines. Every improvement should reflect technical depth, student safety, and clarity for AI parsing. No development artifacts should remain in published content.

            Begin improving the files listed above now.
          claude_args: "--allowedTools 'Read,Edit,Write,Glob,Grep,Bash(git:*)'"

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected, will create PR"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected, skipping PR creation"
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Configure git with token for authentication
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create a unique branch name with timestamp
          BRANCH_NAME="content-improvement-bot/$(date +%Y%m%d-%H%M%S)"
          
          # Create and switch to new branch
          git checkout -b "$BRANCH_NAME"
          
          # Add all changes
          git add .
          
          # Get list of changed files
          CHANGED_FILES=$(git diff --cached --name-only)

          # Create commit message in a temp file
          echo "Automated content improvements" > /tmp/commit-msg.txt
          echo "" >> /tmp/commit-msg.txt
          echo "Files improved:" >> /tmp/commit-msg.txt
          echo "$CHANGED_FILES" >> /tmp/commit-msg.txt
          echo "" >> /tmp/commit-msg.txt

          # Add note if CSV was updated
          if grep -q "^todo/suggested_new_files.csv$" <<< "$CHANGED_FILES"; then
            echo "New article suggestions added to suggested_new_files.csv" >> /tmp/commit-msg.txt
            echo "" >> /tmp/commit-msg.txt
          fi

          echo "Generated by content-improvement-bot workflow" >> /tmp/commit-msg.txt
          
          git commit -F /tmp/commit-msg.txt
          
          # Configure git to use the GH_TOKEN for authentication
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          
          # Push the branch
          git push origin "$BRANCH_NAME"
          
          # Create PR body
          echo "## Automated Content Improvements" > /tmp/pr-body.md
          echo "" >> /tmp/pr-body.md
          echo "This PR contains automated improvements to BJJ Graph content files." >> /tmp/pr-body.md
          echo "" >> /tmp/pr-body.md
          echo "### Files Modified" >> /tmp/pr-body.md
          echo '```' >> /tmp/pr-body.md
          echo "$CHANGED_FILES" >> /tmp/pr-body.md
          echo '```' >> /tmp/pr-body.md
          echo "" >> /tmp/pr-body.md
          echo "### Improvements Applied" >> /tmp/pr-body.md
          echo "- SEO optimization (titles, descriptions, metadata)" >> /tmp/pr-body.md
          echo "- AI search optimization (clear headings, structured Q&A)" >> /tmp/pr-body.md
          echo "- Content standards compliance (V2 format)" >> /tmp/pr-body.md
          echo "- Production-ready formatting" >> /tmp/pr-body.md
          echo "- Bot metadata tracking" >> /tmp/pr-body.md
          echo "" >> /tmp/pr-body.md
          echo "### Review Guidelines" >> /tmp/pr-body.md
          echo "1. Check that all changes maintain technical accuracy" >> /tmp/pr-body.md
          echo "2. Verify SEO metadata is properly formatted" >> /tmp/pr-body.md
          echo "3. Ensure wikilinks still resolve correctly" >> /tmp/pr-body.md
          echo "4. Confirm expert insights remain substantive" >> /tmp/pr-body.md
          echo "" >> /tmp/pr-body.md
          echo "**Generated by**: Content Improvement Bot workflow" >> /tmp/pr-body.md
          echo "**Run ID**: ${{ github.run_id }}" >> /tmp/pr-body.md
          echo "**Triggered**: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> /tmp/pr-body.md
          
          # Create the PR using GitHub CLI (without labels to ensure it always succeeds)
          PR_URL=$(gh pr create \
            --title "Automated content improvements ($(date +%Y-%m-%d))" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH_NAME")

          echo "Created PR: $PR_URL"

          # Try to add labels (optional - won't fail if labels don't exist)
          gh pr edit "$BRANCH_NAME" --add-label "automated" --add-label "content-improvement" || echo "Labels not found, skipping label addition"
