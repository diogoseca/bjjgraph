name: Content Improvement Bot

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 8:00 AM UTC
  workflow_dispatch:
    inputs:
      num_files:
        description: 'Number of files to improve'
        required: false
        default: '2'
        type: choice
        options: ['1', '2', '5', '10', '20']
      enable_paa:
        description: 'Fetch PAA data for AI SEO optimization (costs DataForSEO credits)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  improve-content:
    runs-on: ubuntu-latest
    concurrency:
      group: content-improvement-bot
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git log

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install jsonschema jinja2

      - name: Select oldest files
        id: select_files
        run: |
          chmod +x ./scripts/select_oldest_files.sh
          NUM_FILES=${{ github.event.inputs.num_files || '2' }}
          echo "Selecting $NUM_FILES files from 100 oldest (by git creation date)..."

          SELECTED_FILES=$(./scripts/select_oldest_files.sh "$NUM_FILES")
          echo "selected_files<<EOF" >> $GITHUB_OUTPUT
          echo "$SELECTED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "Selected files:"
          echo "$SELECTED_FILES"

      - name: Pre-process files and prepare context
        id: preprocess
        run: |
          echo "========================================"
          echo "STEP 1: Pre-processing files for Claude"
          echo "========================================"

          mkdir -p /tmp/preprocessing

          # 1. Generate complete content catalog for [[Wikilinks]]
          echo "Generating content catalog..."
          find source/content -type f \( -name "*.json" -o -name "*.md" \) \
            ! -name "CONTRIBUTING-*" ! -name "TEMPLATE*" ! -name "index.md" \
            -exec basename {} \; | \
            sed 's/\.json$//; s/\.md$//' | \
            sort -u > /tmp/preprocessing/content_catalog.txt

          CATALOG_COUNT=$(wc -l < /tmp/preprocessing/content_catalog.txt)
          echo "  ✓ Generated catalog with $CATALOG_COUNT linkable items"

          # 2. Process each selected file
          CLAUDE_FILES=""

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            filename=$(basename "$file")
            file_base="${filename%.*}"
            file_ext="${filename##*.}"

            echo ""
            echo "Pre-processing: $file"

            if [[ "$file_ext" == "json" ]]; then
              # JSON FILE PROCESSING

              # Check file size
              file_size=$(wc -c < "$file" 2>/dev/null || echo "0")

              if [[ $file_size -lt 200 ]] || grep -q "TODO" "$file" 2>/dev/null; then
                echo "  → Empty/minimal file (<200 bytes or has TODOs)"
                echo "  → Running fix_content.sh to fill template..."

                chmod +x ./scripts/fix_content.sh
                if ./scripts/fix_content.sh "$file"; then
                  echo "  ✓ Template filled successfully"
                else
                  echo "  ✗ fix_content.sh failed - skipping this file"
                  continue
                fi
              fi

              # Detect category and template type
              if [[ "$file" == *"/Positions/"* ]]; then
                category="Positions"

                # Detect SINGLE/DUAL/FAMILY
                position_name="${file_base}"
                variant_folder="source/content/Positions/$position_name"

                if [ ! -d "$variant_folder" ]; then
                  template_type="SINGLE"
                  template_file="source/templates/Positions/TEMPLATE-POSITION-SINGLE.json"
                elif ls "$variant_folder"/*.json >/dev/null 2>&1; then
                  template_type="FAMILY"
                  template_file="source/templates/Positions/TEMPLATE-POSITION-FAMILY.json"
                else
                  template_type="DUAL"
                  template_file="source/templates/Positions/TEMPLATE-POSITION-DUAL.json"
                fi

                echo "  → Position template: $template_type"

              elif [[ "$file" == *"/Submissions/"* ]]; then
                category="Submissions"
                template_file="source/templates/Submissions.json"
              elif [[ "$file" == *"/Transitions/"* ]]; then
                category="Transitions"
                template_file="source/templates/Transitions.json"
              elif [[ "$file" == *"/Principles/"* ]]; then
                category="Principles"
                template_file="source/templates/Principles.json"
              elif [[ "$file" == *"/Systems/"* ]]; then
                category="Systems"
                template_file="source/templates/Systems.json"
              else
                echo "  ✗ Unknown category - skipping"
                continue
              fi

              # Copy template to preprocessing dir
              if [ -f "$template_file" ]; then
                cp "$template_file" "/tmp/preprocessing/${file_base}_template.json"
                echo "  ✓ Template copied: $template_file"
              fi

              # Run validation and save results
              echo "  → Validating JSON..."
              python3 scripts/validate_json.py --file "$file" > "/tmp/preprocessing/${file_base}_validation.txt" 2>&1 || true

              if grep -q "Valid" "/tmp/preprocessing/${file_base}_validation.txt"; then
                echo "  ✓ Validation passed"
              else
                echo "  ⚠ Validation issues found (Claude will fix)"
              fi

            else
              # MARKDOWN FILE PROCESSING
              category=$(basename "$(dirname "$file")")

              echo "  → Markdown file in $category"

              # Try to find template
              if ls "source/templates/$category"/*.json >/dev/null 2>&1; then
                template_file=$(ls "source/templates/$category"/*.json | head -1)
                cp "$template_file" "/tmp/preprocessing/${file_base}_template.json"
                echo "  ✓ Template found: $template_file"
              else
                # No template - find 5 random examples
                echo "  → No template, finding 5 example files..."
                find "$(dirname "$file")" -name "*.md" \
                  ! -name "$filename" \
                  ! -name "CONTRIBUTING-*" \
                  ! -name "index.md" \
                  -type f | shuf | head -5 > "/tmp/preprocessing/${file_base}_examples.txt"

                example_count=$(wc -l < "/tmp/preprocessing/${file_base}_examples.txt")
                echo "  ✓ Found $example_count example files"
              fi
            fi

            # Add to Claude's file list
            CLAUDE_FILES="${CLAUDE_FILES}${file}"$'\n'

          done <<< "${{ steps.select_files.outputs.selected_files }}"

          echo ""
          echo "========================================"
          echo "Pre-processing complete!"
          echo "========================================"
          echo "  Content catalog: /tmp/preprocessing/content_catalog.txt"
          echo "  Templates: /tmp/preprocessing/*_template.json"
          echo "  Examples: /tmp/preprocessing/*_examples.txt"
          echo "  Validations: /tmp/preprocessing/*_validation.txt"

          echo "claude_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CLAUDE_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Prepare PAA context with Claude
        if: ${{ github.event.inputs.enable_paa == 'true' || github.event_name == 'schedule' }}
        id: prepare_paa
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are a BJJ SEO analyst preparing "People Also Ask" (PAA) context for AI search optimization.

            # Your Mission
            Fetch PAA data from Google SERP for each article and prepare structured AI SEO guidance.

            # Selected Articles
            ${{ steps.preprocess.outputs.claude_files }}

            # Process for Each Article

            1. **Extract Seed Keyword**
               - Read the file (.md or .json)
               - For .json: use `name` field
               - For .md: use `title` from YAML frontmatter
               - Clean: remove "| BJJ Graph", "| BJJ Submission", etc.
               - Fallback: use filename

            2. **Fetch PAA Data**
               Use `mcp__dataforseo__serp_organic_live_advanced`:
               ```
               keyword: <extracted_keyword>
               location_name: "United States"
               language_code: "en"
               device: "desktop"
               people_also_ask_click_depth: 2
               depth: 50
               ```

            3. **Build AI SEO Context**
               For each article, create `/tmp/paa_output/<filename>_paa.json`:
               ```json
               {
                 "article_path": "source/content/...",
                 "seed_keyword": "extracted keyword",
                 "paa_questions": [
                   {
                     "question": "What is...",
                     "answer_snippet": "...",
                     "source_url": "...",
                     "priority": "high|medium|low",
                     "integration_strategy": "dedicated_faq|improve_heading|add_section"
                   }
                 ],
                 "heading_optimizations": [
                   {
                     "current": "Mount Position",
                     "suggested": "What is Mount Position in BJJ?",
                     "rationale": "Matches conversational query pattern"
                   }
                 ],
                 "missing_content_opportunities": [
                   "Add section: When to Use Mount",
                   "Add section: Common Mount Mistakes"
                 ]
               }
               ```

            4. **Create Summary**
               Create `/tmp/paa_output/summary.txt`:
               - Total PAA questions found
               - High-priority questions (direct answers needed)
               - Content gap analysis
               - Suggested new articles

            5. **Ensure CSV exists**
               Check `tests/artifacts/suggested_new_files.csv` - create if missing with headers: `relative_path,plan`

            Begin processing. Focus on high-intent questions that match user search behavior.
          claude_args: |
            --mcp-config '{"mcpServers":{"dataforseo":{"command":"npx","args":["-y","@modelcontextprotocol/server-dataforseo"],"env":{"DATAFORSEO_LOGIN":"${{ secrets.DATAFORSEO_LOGIN }}","DATAFORSEO_PASSWORD":"${{ secrets.DATAFORSEO_PASSWORD }}"}}}}'
            --allowedTools 'Read,Write,Glob,Bash(mkdir:*),Bash(ls:*),mcp__dataforseo__serp_organic_live_advanced'

      - name: Improve content with AI SEO optimization
        id: improve_content
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are an elite BJJ black belt instructor AND Google AI search optimization expert.

            Your mission: Aggressively optimize BJJ content for AI search engines (Google AI Overview, Bing Chat, Perplexity) while maintaining technical accuracy and safety.

            # Pre-Processed Context Available

            The bash pre-processing step has prepared everything you need:

            ## 1. Content Catalog (for [[Wikilinks]])
            `/tmp/preprocessing/content_catalog.txt` - Complete list of all linkable content

            Read this file FIRST. Use ONLY names from this list for [[Links]].

            **Link format rules:**
            - Use canonical names only: [[Mount]], [[Triangle Choke]], [[Hip Escape]]
            - For positions with variants, prefer specific: [[Mount Top]] not [[Mount]]
            - Bold first mention: **Mount** (also called Mounted Position)
            - Define aliases immediately: "The **Triangle Choke** (or sankaku-jime)..."

            ## 2. Templates & Examples

            For each file, check `/tmp/preprocessing/<filename>_template.json` or `<filename>_examples.txt`

            **If template exists:** Follow JSON structure exactly
            **If examples exist:** Read all 5 examples, identify common patterns, mimic structure

            ## 3. Validation Results

            Check `/tmp/preprocessing/<filename>_validation.txt` for each .json file.

            Fix all validation errors. Common issues:
            - Broken links (use content catalog to fix)
            - Success rates: ensure beginner ≤ intermediate ≤ advanced
            - Missing required fields (check template)

            ## 4. PAA Data (if available)

            ${{ (github.event.inputs.enable_paa == 'true' || github.event_name == 'schedule') && 'Check `/tmp/paa_output/<filename>_paa.json` for each file. Use PAA insights to guide content optimization.' || 'PAA data not available this run.' }}

            # Files to Process
            ${{ steps.preprocess.outputs.claude_files }}

            # AI Search Optimization Strategy

            ## Core Principles

            **1. Conversational Query Matching**
            - Transform headings into natural questions users ask AI
            - Current: "Mount Position Setup" → Optimized: "How do I set up Mount position?"
            - Current: "Triangle Escapes" → Optimized: "What are the best ways to escape Triangle Choke?"
            - Current: "Guard Passing Principles" → Optimized: "How do I pass guard in BJJ?"

            **2. Entity Recognition & Consistency**
            - Always use canonical names: **Mount** (not "mounted position", "top mount")
            - Define aliases on first mention: "**De La Riva Guard** (DLR or De La Riva)"
            - Bold/emphasize entities: "From **Closed Guard**, establish **Sleeve Control**..."
            - Add schema markup notes for entities (we'll handle JSON-LD separately)

            **3. Step-by-Step Clarity (8-15 detailed steps)**
            - Number all sequences: "1. Grip opponent's collar...", "2. Pull opponent forward..."
            - Sub-steps for complex moves: "3a. Bring your right leg over...", "3b. Hook behind head..."
            - Each step is ONE atomic action
            - Start with body positioning, end with completion/transition

            **4. Direct Answer Boxes**
            - First paragraph = concise 2-3 sentence answer to title question
            - Front-load key facts: success rates, difficulty level, prerequisites
            - Example: "Mount is an offensive position where you sit on opponent's torso. Success rate: Beginner 50%, Advanced 75%. Requires: base, hip control, weight distribution."

            ## Content Restructuring Guidelines

            **You have FULL REWRITE AUTHORITY.** Optimize aggressively for AI SEO.

            ### For .json Files

            **Read:**
            1. Template: `/tmp/preprocessing/<filename>_template.json`
            2. Current file content
            3. Validation results: `/tmp/preprocessing/<filename>_validation.txt`
            4. PAA data: `/tmp/paa_output/<filename>_paa.json` (if available)

            **Optimize:**
            - Fill all template fields
            - Fix validation errors
            - Add 8-15 detailed execution steps
            - Ensure all transitions reference real positions from content catalog
            - Success rates: realistic, properly ordered
            - Add [[Wikilinks]] throughout (6-15 minimum)

            **For PAA Integration:**
            - Weave high-priority questions into existing sections
            - Add dedicated FAQ field at end with 5-10 Q&As
            - Improve field names/structure to match conversational queries

            ### For .md Files

            **Read:**
            1. Template OR examples: `/tmp/preprocessing/<filename>_template.json` or `<filename>_examples.txt`
            2. Current file content
            3. PAA data: `/tmp/paa_output/<filename>_paa.json` (if available)

            **Optimize:**

            **Structure transformation:**
            ```markdown
            # How do I [Technique]? | BJJ Graph

            <!-- Direct answer box (2-3 sentences) -->
            **[Technique]** is [concise definition]. Success rate: Beginner X%, Advanced Y%. Requires: [prerequisites].

            ## What is [Technique]?

            [Definition paragraph - define all entities, use canonical names]

            **[Technique Name]** (also called [aliases]) is when [description]...

            From **[[Starting Position]]**, you transition to **[[Ending Position]]**...

            ## How to Execute [Technique] (Step-by-Step)

            Follow these 10 steps to master [Technique]:

            1. **Setup:** [detailed action]
            2. **Grip:** [detailed action with specifics]
            3. **Movement:** [detailed body mechanics]
            ...
            10. **Finish:** [completion criteria]

            ## When Should I Use [Technique]?

            [Situational guidance with clear scenarios]

            ## What are Common Mistakes with [Technique]?

            **⚠️ DANGER:** [Critical safety/technical error]

            1. **Mistake:** [common error]
               **Fix:** [how to correct]

            ## Frequently Asked Questions

            ### [PAA Question 1 from DataForSEO]?
            [Direct 2-4 sentence answer]

            ### [PAA Question 2]?
            [Direct answer]

            [5-10 FAQ questions total]

            ## Related Techniques

            - **[[Related Technique 1]]** - [how it relates]
            - **[[Related Technique 2]]** - [how it relates]
            ```

            **Heading optimization:**
            - Convert ALL headings to questions where possible
            - Use natural language: "How", "What", "When", "Why", "Which"
            - Match PAA questions when available

            **Content density:**
            - Paragraphs: 2-4 sentences max
            - Lists: Use bullet/numbered lists extensively
            - Bold: Emphasize entities and key terms
            - Links: 10-20 [[Wikilinks]] minimum per article

            ## Production Requirements

            **REMOVE immediately:**
            - TODO, FIXME, XXX, HACK, NOTE TO DEV
            - "SEO TODO:", "[Add keywords]", "PLACEHOLDER"
            - "DRAFT", "WIP", "TBD", "Coming soon"
            - Vague language: "might work", "could be effective", "possibly"
            - Internal paths: `/tests/artifacts/`, `/docs/`
            - Incomplete sentences or "..." trails

            **ADD if missing:**
            - Bot metadata in YAML:
              ```yaml
              bot_metadata:
                last_improved: "$(date +%Y-%m-%d)"
                optimization_pass: "ai_seo_v1"
              ```

            ## New Article Suggestions

            If PAA reveals content gaps or you identify opportunities:
            - Append to `tests/artifacts/suggested_new_files.csv`
            - Format: `relative_path,"plan with why/target/sections"`
            - Example: `source/content/Principles/Base-Maintenance.md,"Core principle referenced in 20+ positions; target: beginners; sections: definition, mechanics, drills; gap: no dedicated article exists"`

            # Execution Order

            Process files in this order:
            1. Read content catalog
            2. For each file:
               a. Read template/examples
               b. Read validation results (if .json)
               c. Read PAA data (if available)
               d. Read current file
               e. Apply aggressive AI SEO optimization
               f. Save updated file

            Begin optimization now. Make every article a top AI search result.
          claude_args: "--allowedTools 'Read,Edit,Write,Bash(date:*),Bash(cat:*)'"

      - name: Validate and retry .json files
        id: validate_retry
        run: |
          echo "========================================"
          echo "Validating and retrying .json files"
          echo "========================================"

          chmod +x ./scripts/fix_content.sh
          UPDATED_FILES=""
          FIXED_FILES=""

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [[ "$file" != *.json ]] && continue

            echo ""
            echo "Validating: $file"

            if python3 scripts/validate_json.py --file "$file" 2>&1 | grep -q "Valid"; then
              echo "  ✓ Validation passed"
              UPDATED_FILES="${UPDATED_FILES}${file}"$'\n'
            else
              echo "  ✗ Validation failed - retrying with fix_content.sh (max 3 attempts)"

              attempts=0
              fixed=false

              while [[ $attempts -lt 3 ]]; do
                ((++attempts))
                echo "    Attempt $attempts/3..."

                if ./scripts/fix_content.sh "$file"; then
                  if python3 scripts/validate_json.py --file "$file" 2>&1 | grep -q "Valid"; then
                    echo "    ✓ Fixed successfully"
                    UPDATED_FILES="${UPDATED_FILES}${file}"$'\n'
                    FIXED_FILES="${FIXED_FILES}${file}"$'\n'
                    fixed=true
                    break
                  fi
                fi
              done

              if [ "$fixed" = false ]; then
                echo "    ✗ Failed after 3 attempts - manual review needed"
              fi
            fi
          done <<< "${{ steps.preprocess.outputs.claude_files }}"

          echo ""
          echo "========================================"
          echo "Validation complete"
          echo "========================================"

          echo "updated_json_files<<EOF" >> $GITHUB_OUTPUT
          echo "$UPDATED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "fixed_json_files<<EOF" >> $GITHUB_OUTPUT
          echo "$FIXED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Regenerate markdown from validated .json
        if: steps.validate_retry.outputs.updated_json_files != ''
        run: |
          echo "Regenerating markdown from validated .json files..."

          while IFS= read -r json_file; do
            [ -z "$json_file" ] && continue
            echo "  → $json_file"
            python3 scripts/json_to_md.py --file "$json_file" || echo "    ⚠ Warning: Regeneration failed"
          done <<< "${{ steps.validate_retry.outputs.updated_json_files }}"

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT

            CHANGED_FILES=$(git status --porcelain | wc -l)
            JSON_CHANGES=$(git status --porcelain | grep "\.json$" | wc -l)
            MD_CHANGES=$(git status --porcelain | grep "\.md$" | wc -l)

            echo "changes_count=$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "json_count=$JSON_CHANGES" >> $GITHUB_OUTPUT
            echo "md_count=$MD_CHANGES" >> $GITHUB_OUTPUT

            echo "Changes detected:"
            echo "  Total: $CHANGED_FILES files"
            echo "  JSON: $JSON_CHANGES files"
            echo "  MD: $MD_CHANGES files"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes"
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="content-improvement-bot/$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          git add .

          CHANGED_FILES=$(git diff --cached --name-only)

          cat > /tmp/commit-msg.txt << EOF
          Automated AI SEO content optimization

          Files optimized: ${{ steps.check_changes.outputs.changes_count }}
          - JSON files: ${{ steps.check_changes.outputs.json_count }}
          - Markdown files: ${{ steps.check_changes.outputs.md_count }}

          Optimizations:
          - Conversational query headings
          - Entity consistency (canonical names)
          - 8-15 step execution sequences
          - PAA FAQ integration: ${{ (github.event.inputs.enable_paa == 'true' || github.event_name == 'schedule') && 'enabled' || 'disabled' }}
          - [[Wikilink]] validation
          - JSON schema validation

          Files:
          $CHANGED_FILES

          Generated by content-improvement-bot workflow
          EOF

          git commit -F /tmp/commit-msg.txt
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          git push origin "$BRANCH_NAME"

          cat > /tmp/pr-body.md << 'EOFBODY'
          ## 🤖 Automated AI SEO Content Optimization

          This PR contains **aggressive AI search optimization** using the modernized workflow with intelligent bash pre-processing.

          ### 📊 Summary
          - **JSON files**: ${{ steps.check_changes.outputs.json_count }}
          - **Markdown files**: ${{ steps.check_changes.outputs.md_count }}
          - **Total changes**: ${{ steps.check_changes.outputs.changes_count }} files
          - **PAA data**: ${{ (github.event.inputs.enable_paa == 'true' || github.event_name == 'schedule') && '✅ Enabled (DataForSEO)' || '❌ Disabled' }}
          - **Auto-fixed**: ${{ steps.validate_retry.outputs.fixed_json_files != '' && 'Yes (validation retry loop)' || 'None needed' }}

          ### 🎯 AI SEO Optimizations Applied

          **Conversational Query Matching:**
          - Headings transformed to questions: "What is Mount?", "How do I escape?"
          - First paragraph = direct answer box for AI snippets

          **Entity Recognition:**
          - Canonical names used consistently: **Mount**, **Triangle Choke**
          - Aliases defined on first mention: "**De La Riva** (DLR)"
          - Bold emphasis on all technique/position names

          **Step-by-Step Clarity:**
          - All techniques have 8-15 detailed steps
          - Each step = one atomic action
          - Sub-steps for complex movements

          **PAA Integration** ${{ (github.event.inputs.enable_paa == 'true' || github.event_name == 'schedule') && '(Enabled)' || '(Disabled)' }}:
          - Dedicated FAQ sections at article end
          - 5-10 questions from Google PAA data
          - High-priority questions woven into content

          **[[Wikilink]] Validation:**
          - All links validated against content catalog
          - 10-20 links per article minimum
          - Prefer specific variants: [[Mount Top]] over [[Mount]]

          ### 🔧 Technical Processing

          **Pre-processing (Bash):**
          1. Generated content catalog → `/tmp/preprocessing/content_catalog.txt`
          2. Auto-filled empty .json files (<200 bytes) with `fix_content.sh`
          3. Detected template types (SINGLE/DUAL/FAMILY positions)
          4. Read templates and 5 examples per file
          5. Pre-validated .json files, saved results

          **Claude Optimization:**
          - Full rewrite authority for AI SEO
          - Used pre-processed context (no file discovery overhead)
          - Applied entity consistency rules
          - Converted headings to questions
          - Added detailed execution steps

          **Post-processing:**
          - Validated all .json files
          - Retry loop (max 3 attempts) for validation failures
          - Auto-generated .md from validated .json
          - Preserved JSON as source of truth

          ### 📝 Files Modified
          ```
          $CHANGED_FILES
          ```

          ### ✅ Review Checklist
          - [ ] Headings are conversational questions
          - [ ] First paragraphs are direct answers (2-3 sentences)
          - [ ] Entities use canonical names consistently
          - [ ] All techniques have 8-15 detailed steps
          - [ ] FAQ sections present (if PAA enabled)
          - [ ] [[Wikilinks]] resolve correctly
          - [ ] JSON validates successfully
          - [ ] No dev artifacts (TODO, FIXME, etc.)
          - [ ] Success rates properly ordered

          ---
          **Workflow**: Content Improvement Bot (AI SEO Optimized)
          **Run ID**: ${{ github.run_id }}
          **Timestamp**: $(date -u '+%Y-%m-%dT%H:%M:%SZ')
          **Selection**: Git creation date (oldest files)
          **Model**: Claude Sonnet 4.5
          EOFBODY

          PR_URL=$(gh pr create \
            --title "🤖 AI SEO optimization ($(date +%Y-%m-%d))" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH_NAME")

          echo "Created PR: $PR_URL"
          gh pr edit "$BRANCH_NAME" --add-label "automated" --add-label "content-improvement" --add-label "ai-seo" || true
