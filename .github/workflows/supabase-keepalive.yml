name: Supabase Keepalive

# Prevents Supabase free-tier project from auto-pausing after 7 days of inactivity
# Pings the REST API every 5 days

on:
  schedule:
    - cron: '0 12 */5 * *'
  workflow_dispatch:

# Least privilege (v1.265.1): the job checks out nothing and calls no GitHub API (one curl to Supabase), so its
# GITHUB_TOKEN gets no scope at all. Every workflow declares its permissions (tests/bot_workflows_test.py).
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # The two values reach the script as environment variables (v1.265.3), never pasted into its text, so no byte of
      # either is ever read as shell. Pinned by tests/bot_workflows_test.py (test_secrets_reach_shells_only_through_env).
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL not set, skipping"
            exit 0
          fi
          # Query a real table (RLS filters rows -> empty 200 for the publishable key)
          # rather than the /rest/v1/ root, which now rejects publishable keys (401)
          # under Supabase's new sb_publishable_/sb_secret_ key format. This also
          # exercises PostgREST + Postgres, registering genuine activity.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/user_training_data?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Supabase ping status: $STATUS"
          if [ "$STATUS" -ge 400 ]; then
            echo "Warning: Supabase returned $STATUS"
            exit 1
          fi
