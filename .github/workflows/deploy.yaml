name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - run: npm install
        working-directory: ./source

      - name: chmod
        run: chmod +x ./quartz/bootstrap-cli.mjs
        working-directory: ./source

      - name: Ensure Quartz builds
        run: npx quartz build --bundleInfo -d ../content
        working-directory: ./source

  deploy:
    needs: build-and-test
    env:
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      POSTHOG_API_HOST: ${{ secrets.POSTHOG_API_HOST }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.11'

      # SECURITY/integrity gate: validate content + graph BEFORE building/deploying so
      # poisoned or malformed content (e.g. from a merged community PR) cannot reach
      # production. Non-zero exit here fails the job and blocks the deploy.
      - name: Validate content (gate)
        run: |
          pip install jsonschema
          python3 scripts/validate_json.py --all
          python3 scripts/validate_graph_integrity.py

      - name: Build Quartz
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_API_HOST: ${{ secrets.POSTHOG_API_HOST }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          npm install
          npx quartz build -d ../content
          python3 ../scripts/regenerate_redirects.py
          python3 ../scripts/regenerate_headers.py
          python3 ../scripts/regenerate_llms_txt.py
        working-directory: ./source

      - name: Copy raw HTML folder
        run: |
          ls -la
          cp -r raw_html/* public/ || true
          echo "Contents of public directory:"
          ls -la public/
        working-directory: ./source

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy source/public --project-name=bjjgraph

  lighthouse-ci:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
        with:
          urls: |
            https://bjjgraph.org/
          uploadArtifacts: true
          temporaryPublicStorage: true

  indexnow:
    needs:
      - deploy
      - lighthouse-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Submit sitemap to IndexNow
        uses: bojieyang/indexnow-action@cd6d1576582c1839b80dd71f418f172aa40d6552 # v2 # v2 is the latest major version following action-versioning.
        with:
          # The location of the sitemap must start with http(s); XML Sitemap, Sitemap index, RSS and Atom formats are supported.
          sitemap-location: "https://bjjgraph.org/sitemap.xml"
          # The IndexNow key - must match the key file at https://bjjgraph.org/77f7cddd8fa9441797b0c5b19106919a.txt
          key: "77f7cddd8fa9441797b0c5b19106919a"

  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Compute date-based tag
        id: tag
        run: |
          BASE="v$(date -u +%Y.%m.%d)"
          TAG="$BASE"
          N=1
          while git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; do
            TAG="${BASE}.${N}"
            N=$((N + 1))
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release with graph.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -k graph.json
          gh release create "${{ steps.tag.outputs.tag }}" \
            graph.json \
            graph.json.gz \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "Auto-release of BJJGraph knowledge graph data." \
            --latest
