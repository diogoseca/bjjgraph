name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - run: npm install
        working-directory: ./source

      - name: chmod
        run: chmod +x ./quartz/bootstrap-cli.mjs
        working-directory: ./source

      - name: Ensure Quartz builds
        run: npx quartz build --bundleInfo -d ../content
        working-directory: ./source

  deploy:
    needs: build-and-test
    env:
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      POSTHOG_API_HOST: ${{ secrets.POSTHOG_API_HOST }}
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Quartz
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_API_HOST: ${{ secrets.POSTHOG_API_HOST }}
        run: |
          npm install
          npx quartz build -d ../content
        working-directory: ./source

      - name: Copy raw HTML folder
        run: |
          ls -la
          cp -r raw_html/* public/ || true
          echo "Contents of public directory:"
          ls -la public/
        working-directory: ./source

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy source/public --project-name=bjjgraph

  lighthouse-ci:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
        with:
          urls: |
            https://bjjgraph.org/
          uploadArtifacts: true
          temporaryPublicStorage: true

  indexnow:
    needs:
      - deploy
      - lighthouse-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Submit sitemap to IndexNow
        uses: bojieyang/indexnow-action@v2 # v2 is the latest major version following action-versioning.
        with:
          # The location of the sitemap must start with http(s); XML Sitemap, Sitemap index, RSS and Atom formats are supported.
          sitemap-location: "https://bjjgraph.org/sitemap.xml"
          # The IndexNow key - must match the key file at https://bjjgraph.org/77f7cddd8fa9441797b0c5b19106919a.txt
          key: "77f7cddd8fa9441797b0c5b19106919a"

  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute date-based tag
        id: tag
        run: |
          BASE="v$(date -u +%Y.%m.%d)"
          TAG="$BASE"
          N=1
          while git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; do
            TAG="${BASE}.${N}"
            N=$((N + 1))
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release with graph.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            graph.json \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "Auto-release of BJJGraph knowledge graph data." \
            --latest
