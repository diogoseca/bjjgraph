name: Deploy to Preview (dev branch)

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      POSTHOG_API_HOST: ${{ secrets.POSTHOG_API_HOST }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.11'

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Integrity gate (same as prod): don't auto-deploy unvalidated content to the
      # public dev preview, which carries the same secrets as prod.
      - name: Validate content (gate)
        run: |
          pip install jsonschema
          python3 scripts/validate_json.py --all
          python3 scripts/validate_graph_integrity.py

      # The Neural app bundle + its data payloads live under source/quartz/static/neural/,
      # which is GITIGNORED (build artifacts, 13.5MB+ payloads). Without this step the built
      # site — and therefore the deployed preview AND the journey gate — contains no Neural
      # front-end at all. Regenerate from the committed sources (neural/src, scripts/, graph
      # + content JSON) so what we test is what we ship.
      - name: Regenerate Neural app + data
        run: |
          (cd source && npm install)
          npm run regenerate:neural

      - name: Build Quartz
        run: |
          npm install
          npx quartz build -d ../content
          python3 ../scripts/regenerate_redirects.py
          python3 ../scripts/regenerate_headers.py
          python3 ../scripts/check_headers_cache.py
          # SEO ratchet: head + JSON-LD identical, crawlable text above floor,
          # zero internal links lost. Was referenced by NO workflow before v1.77.0.
          python3 ../scripts/check_seo_parity.py
          # PARITY: prod runs this too. Without it the preview shipped no llms.txt,
          # so the AI-crawler surface was never actually exercised before prod.
          python3 ../scripts/regenerate_llms_txt.py
        working-directory: ./source

      - name: Copy raw HTML folder
        run: |
          cp -r raw_html/* public/ || true
        working-directory: ./source

      # Quartz clears source/public, so Forward must be copied after the site build.
      - name: Build Forward development libraries
        run: npm run build:forward

      - name: Install root dependencies (Playwright test runner)
        run: npm install

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Fast representative gate. The complete suite runs sharded before merges to main.
      - name: Curated journey gate (Playwright E2E)
        timeout-minutes: 12
        run: npm run test:curated

      - name: Upload journey artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journey-test-results
          path: |
            e2e/test-results/
            test-results/
          if-no-files-found: ignore

      - name: Deploy to Cloudflare Pages (preview)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy source/public --project-name=bjjgraph --branch=dev
