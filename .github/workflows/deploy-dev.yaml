name: Deploy to Preview (dev branch)

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

# dev is the hot branch, so an in-flight preview deploy is made obsolete by the very next
# push — cancel it rather than paying for a preview nobody will look at. Cancelling is
# safe HERE in a way it is deliberately not safe for production (see deploy.yaml): this
# workflow only ever publishes to the `dev` preview alias, and `wrangler pages deploy`
# activates a deployment only once its upload has completed, so a cancelled run leaves
# the previous preview serving rather than a half-published one. The production alias is
# never touched by this workflow.
concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      POSTHOG_API_HOST: ${{ secrets.POSTHOG_API_HOST }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Integrity gate (same as prod): don't auto-deploy unvalidated content to the
      # public dev preview, which carries the same secrets as prod.
      - name: Validate content (gate)
        run: |
          pip install jsonschema
          python3 scripts/validate_json.py --all
          python3 scripts/validate_graph_integrity.py
          # Share-link ordinal lockfile (node_ordinals.json): every live graph node must
          # already own a PERMANENT ordinal, and no committed ordinal may have been
          # renumbered or reused. A share link posted in a gym WhatsApp group encodes
          # ordinals; renumber one and every link already in the wild silently starts
          # pointing at different techniques. Hard gate, no ratchet.
          # HEAD^1, not HEAD: in CI the checked-out HEAD *is* the commit under test, so a
          # HEAD baseline would compare it to itself and prove nothing.
          python3 scripts/regenerate_node_ordinals.py --check --baseline-ref HEAD^1

      # The Neural app bundle + its data payloads live under source/quartz/static/neural/,
      # which is GITIGNORED (build artifacts, 13.5MB+ payloads). Without this step the built
      # site — and therefore the deployed preview AND the journey gate — contains no Neural
      # front-end at all. Regenerate from the committed sources (neural/src, scripts/, graph
      # + content JSON) so what we test is what we ship.
      - name: Regenerate Neural app + data
        run: |
          (cd source && npm install)
          npm run regenerate:neural

      - name: Build Quartz
        run: |
          npm install
          npx quartz build -d ../content
          python3 ../scripts/regenerate_redirects.py
          python3 ../scripts/regenerate_headers.py
          python3 ../scripts/check_headers_cache.py
          # SEO ratchet: head + JSON-LD identical, crawlable text above floor,
          # zero internal links lost. Was referenced by NO workflow before v1.77.0.
          python3 ../scripts/check_seo_parity.py
          # PARITY: prod runs this too. Without it the preview shipped no llms.txt,
          # so the AI-crawler surface was never actually exercised before prod.
          python3 ../scripts/regenerate_llms_txt.py
        working-directory: ./source

      # Share-link static shell (/l.html + /l-manifest.json) and its SEO gate.
      # MUST be a step here: deploy does NOT run root `npm run build`, so anything wired only
      # into that script runs locally and never in production. Emits the shell the /l/* -> 200
      # rewrite serves (the no-Function rung of the share feature) plus the ordinal->name
      # manifest the Pages Function reads for link previews, then FAILS the deploy if a /l URL
      # leaked into sitemap.xml or llms.txt. Runs after the Quartz build (which writes both).
      - name: Build share-link shell (/l)
        run: node scripts/build_share_shell.mjs

      # Quartz clears source/public, so Forward must be copied after the site build.
      - name: Build Forward development libraries
        run: npm run build:forward

      # PAYLOAD RATCHET (gate) — PARITY with prod, and the earlier of the two places it runs,
      # so a byte regression is caught on the preview rather than on bjjgraph.org. Compares the
      # built site against the ceilings in tests/artifacts/budget_site.json (shared bundles,
      # nine page archetypes, aggregate emitted HTML bytes) and fails when the payload grows.
      # Must run AFTER `Copy raw HTML folder` + `Build Forward development libraries`: those
      # write into source/public and the committed ceilings were seeded from a tree containing
      # them. Raising a ceiling requires `--update` in a deliberate, justified commit.
      - name: Payload budget (gate)
        run: npm run validate:payload

      # PARITY with prod: the preview is publicly reachable, so its product links must
      # be attributable too. The affiliate ref is a deployment parameter, not content —
      # content/Systems/*.json ships `?ref=REPLACE_ME` so a fork or a local build needs
      # no secret. Stamped into the BUILT artifacts here: after every step that writes or
      # clears source/public, before the journey gate. Unset secret = WARNING + placeholder
      # left in place, never a failed deploy (see CLAUDE.md §7, the canonical affiliate spec).
      - name: Stamp affiliate ref into build output
        env:
          AFFILIATE_REF: ${{ secrets.AFFILIATE_REF }}
        run: python3 scripts/apply_affiliate_ref.py

      # Must follow the stamp — see the prod workflow for why.
      - name: Systems payload gate (dead highlights + dead affiliate links)
        env:
          AFFILIATE_REF: ${{ secrets.AFFILIATE_REF }}
        run: python3 scripts/check_systems_payload.py

      # Disclosure wording + proximity, verified-links-only, and no affiliate URL in the
      # committed graph.json. Source-and-content only, so it is stamp-independent.
      - name: Affiliate compliance gate (disclosure drift + unverified links)
        run: python3 scripts/check_affiliate_surface.py

      # ANALYTICS SURFACE GATE — PARITY with prod, and deliberately the earlier of the two places
      # it runs. The preview is where a keyless build would first be visible, and it is the branch
      # v1.136.1 actually shipped broken. Reads the BUILT postscript.js and asserts the PostHog
      # injection matches this run's environment BOTH ways: with a key, exactly one posthog.init()
      # carrying THIS key plus the stub loader; without one, zero of either anywhere in the
      # emitted JS (a build that silently stops injecting stops collecting analytics, and nothing
      # errors).
      #
      # MUST be a step here as well as in deploy.yaml: deploy does NOT run root `npm run build`,
      # so a gate wired only into that script never runs in production, and ci-validate has no
      # build to read. Absent from one of these two files = absent from that deploy.
      #
      # The env: line is load-bearing — the gate reads the key at GATE time, the emitter read it
      # at BUILD time; without it the step grades the wrong branch and can pass vacuously.
      - name: Analytics surface gate (PostHog injection matches the environment)
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: npm run validate:analytics

      - name: Install root dependencies (Playwright test runner)
        run: npm install

      # Key the browser cache on the PLAYWRIGHT VERSION, never on the lockfile hash.
      # This repo bumps package.json on every commit and package-lock.json mirrors that
      # version, so a hashFiles('package-lock.json') key changed on essentially every
      # commit. Verified on run 31319192519: "Cache not found for input keys:
      # Linux-playwright-f9289ead..." followed at post-job by "Sent 274155745 of
      # 274155745" — a MISS on every run that still uploaded 261 MiB on every run, i.e.
      # strictly worse than having no cache at all.
      # The resolved @playwright/test version is the correct key because it is exactly
      # what decides which browser revision `npx playwright install` expects, and it
      # still moves when Playwright is upgraded — so an upgrade can never score an exact
      # hit on browsers built for the old revision. A restore-keys near-miss is safe for
      # the same reason: a prefix match leaves `cache-hit` false, so the full install
      # step below still runs and fetches the correct revision. Do NOT "improve" those
      # `if:` guards to use cache-matched-key — that is what would resurrect the
      # revision-mismatch failure this repo has already been bitten by.
      - name: Resolve Playwright version
        id: pw-version
        run: |
          V="$(node -p "require('@playwright/test/package.json').version" 2>/dev/null || true)"
          if [ -z "$V" ]; then
            V="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version" 2>/dev/null || true)"
          fi
          if [ -z "$V" ]; then
            echo "::error::Could not resolve the @playwright/test version; refusing to key the browser cache on a guess."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Playwright $V"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Fast representative gate. The complete suite runs sharded before merges to main.
      - name: Curated journey gate (Playwright E2E)
        timeout-minutes: 12
        run: npm run test:curated

      - name: Upload journey artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: journey-test-results
          path: |
            e2e/test-results/
            test-results/
          if-no-files-found: ignore

      # v4 is the first wrangler-action major that runs on Node 24 (v3 got no backport).
      # Its one behaviour change: the Wrangler CLI it installs defaults to v4 (`latest`)
      # instead of v3. Same note as deploy.yaml — pin with `wranglerVersion:` if needed.
      # This preview deploy is the FIRST place a Wrangler-v4 regression would surface.
      - name: Deploy to Cloudflare Pages (preview)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy source/public --project-name=bjjgraph --branch=dev
