name: Complete Playwright E2E

on:
  pull_request:
    branches: ["main", "dev"]
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:
    inputs:
      publication_only:
        description: "Diagnose PR217 publication against its verified existing site; no build or full suite"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: complete-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publication_only) }}
    name: Build tested site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Publication provenance and its curated oracle require complete history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate Neural app and data
        run: npm run regenerate:neural

      - name: Build production site and Forward libraries
        id: site-build
        run: npm run build

      # THE BUILD'S SHAPE, AND THE ONLY PR JOB THAT CAN CHECK IT.
      # `npm run build` above already ran validate:payload, whose TIER-0 FLOORS reject a
      # build that emitted a fraction of the site — those run on both deploys too. This
      # step adds the half that must NOT run on a deploy: exact census equality against
      # tests/artifacts/build_fingerprint.json (page counts per archetype, the JSON-LD
      # @type histogram, the structural markers, the three bundle hashes, and the
      # distinct-value counts that catch a field which stopped varying).
      #
      # It belongs on a PR and not on a deploy because a legitimate content edit MOVES
      # these numbers, and the correct response is to re-seed in the same PR — the same
      # contract tests/corpus_census.test.mjs already has with `npm run census:update`.
      # On a deploy there is no such opportunity, so it would only ever be a tripwire.
      - name: Build shape (tier-0 floors + committed census)
        run: npm run validate:build-shape

      # THE KEYLESS HALF OF THE ANALYTICS CONTRACT, AND THE ONLY PLACE ON A PR IT CAN RUN.
      # `validate:analytics` grades the built site against the key its build ran with, and every
      # deploy carries POSTHOG_API_KEY — so the deploys only ever prove the WITH-key direction, and
      # the mutant that matters (deleting `&& cfg.analytics.apiKey`, which is what shipped
      # posthog.init("") in v1.136.1) changes nothing when a key is present. It therefore survives
      # every deploy AND every ci-validate run, which never builds at all.
      # This step builds its own one-file fixture with the key REMOVED (~1s, not the 10-min corpus)
      # and grades that, so the mutant turns this job red on the PR that introduces it.
      - name: Analytics surface — the keyless direction (fixture build)
        run: npm run validate:analytics:nokey

      - name: Package tested site
        # Preserve a successfully built site when a later census/analytics gate fails.
        # Shards still require the entire build job to pass.
        if: ${{ !cancelled() && steps.site-build.outcome == 'success' }}
        # THE WHOLE TREE, NOT AN ALLOW-LIST (v1.104.6). The list below used to name six paths, and
        # it predated every spec that reads a seventh: share-camera/share-lists/share-mobile
        # readFileSync `public/l.html`, `_redirects` and `l-manifest.json`; legacy-gone and
        # static-article-layout `goto("/Positions/Mount/Top")`; systems-surface goes to
        # `/Systems/*`; the SEO journey fetches `/sitemap.xml` and `/llms.txt`. None were packaged,
        # so the full sharded suite — the PR gate for BOTH main and dev — could not pass, and
        # nothing reported the drift because an allow-list rots silently. If size ever bites, use
        # --exclude: a new emitted path must be packaged by DEFAULT.
        # Fresh-asset journeys compare HTTP responses with the original emitted bytes.
        # Keep those build inputs beside the public tree on every clean shard.
        run: |
          for built in neural/dist/*; do
            test -f "$built"
            cmp "$built" "source/public/static/neural/app/$(basename "$built")"
          done
          cmp source/quartz/static/neural/graph-data.json source/public/static/neural/graph-data.json
          tar -czf complete-e2e-site.tgz source/public neural/dist source/quartz/static/neural/graph-data.json

      - name: Upload tested site
        if: ${{ !cancelled() && steps.site-build.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-e2e-site
          path: complete-e2e-site.tgz
          retention-days: 1

  test:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publication_only) }}
    name: E2E shard ${{ matrix.shard }}/4
    needs: build
    runs-on: ubuntu-latest
    # Ceiling lowered 45 -> 25 so a hung shard fails in under half an hour instead of
    # parking a runner for three quarters of one. 4 shards is the measured optimum
    # (N=4 ~13.6 min wall vs N=2 ~21.3 min) — do not change the shard count to chase
    # this number.
    #
    # Why 25 and not 15: the only green full-suite run in CI history (31238865387, main,
    # 2026-08-08) had shards at 12m38s / 19m34s / 24m01s / 19m32s, so a 15-minute ceiling
    # would have killed three of the four. That run predates the v1.76.4 WebGL
    # nav-commit fix, and the post-fix speedup measured on the curated gate (5m51s ->
    # 1m57s on CI, ~3x) projects the worst shard to ~8-9 min — but that is a projection:
    # no post-fix SHARDED run exists yet to confirm it. A timeout exists to bound a hang,
    # so it must sit above the slowest run we have actually observed; picking 15 on an
    # unverified projection would risk reddening the gate on every PR into main and dev.
    # 25 still reclaims 20 minutes per stuck shard and cannot break a working run.
    #
    # TIGHTEN THIS to 15 once one post-fix sharded run is green — check the real per-shard
    # durations first and set the ceiling from them, not from this comment.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Publication provenance and its curated oracle require complete history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      # Publication journeys import the real Quartz parser/renderer and its native Git
      # oracle. Root --ignore-scripts intentionally skips the source/ postinstall.
      # Install their locked dependencies explicitly; keep serving the build job's artifact.
      - name: Install source dependencies for publication journeys
        run: npm ci --no-audit --no-fund
        working-directory: source

      # download-artifact v8 fails the job on a digest mismatch (v4 only warned), and it
      # skips decompressing a non-zip payload. Both are fine here — the `build` job above
      # uploads a normal (archived) artifact — but upload- and download-artifact must be
      # bumped as a PAIR: this step reads what that step wrote.
      - name: Download tested site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: complete-e2e-site

      - name: Extract tested site
        run: |
          tar -xzf complete-e2e-site.tgz

      # Key the browser cache on the PLAYWRIGHT VERSION, never on the lockfile hash.
      # This repo bumps package.json on every commit and package-lock.json mirrors that
      # version, so a hashFiles('package-lock.json') key changed on essentially every
      # commit. Verified on run 31319192519: "Cache not found for input keys:
      # Linux-playwright-f9289ead..." followed at post-job by "Sent 274155745 of
      # 274155745" — a MISS on every run that still uploaded 261 MiB on every run, i.e.
      # strictly worse than having no cache at all. Four shards paid that toll each.
      # The resolved @playwright/test version is the correct key because it is exactly
      # what decides which browser revision `npx playwright install` expects, and it
      # still moves when Playwright is upgraded — so an upgrade can never score an exact
      # hit on browsers built for the old revision. A restore-keys near-miss is safe for
      # the same reason: a prefix match leaves `cache-hit` false, so the full install
      # step below still runs and fetches the correct revision. Do NOT "improve" those
      # `if:` guards to use cache-matched-key — that is what would resurrect the
      # revision-mismatch failure this repo has already been bitten by.
      - name: Resolve Playwright version
        id: pw-version
        run: |
          V="$(node -p "require('@playwright/test/package.json').version" 2>/dev/null || true)"
          if [ -z "$V" ]; then
            V="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version" 2>/dev/null || true)"
          fi
          if [ -z "$V" ]; then
            echo "::error::Could not resolve the @playwright/test version; refusing to key the browser cache on a guess."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Playwright $V"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run complete E2E shard
        run: npm test -- --shard=${{ matrix.shard }}/4

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-e2e-results-${{ matrix.shard }}
          path: |
            e2e/test-results/
            test-results/
          if-no-files-found: ignore

  publication-diagnostic:
    name: Publication-only diagnostic (verified PR217 site)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      ARTIFACT_RUN: "36237655834"
      ARTIFACT_ID: "10904812270"
      ARTIFACT_HEAD: "f99bbf84792baab76a64f8f6a4cc10d3f00d48ec"
      TESTED_MERGE: "718126b048b0ef6371d831309da9590d87e0d946"
      TESTED_BASE: "aa80296361ee9d500a5bef3799d0f5a8fa6e56de"
      DISPATCH_SHA: ${{ github.sha }}
    steps:
      - name: Checkout the exact previously tested PR merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: "718126b048b0ef6371d831309da9590d87e0d946"
          fetch-depth: 0

      - name: Verify artifact provenance and the tests-only overlay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN" > "$RUNNER_TEMP/publication-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN/jobs?per_page=100" > "$RUNNER_TEMP/publication-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/publication-artifact.json"
          python3 - <<'PYVERIFY'
          import json, os, pathlib, subprocess
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          run = json.loads((tmp / "publication-run.json").read_text())
          jobs = json.loads((tmp / "publication-jobs.json").read_text())["jobs"]
          artifact = json.loads((tmp / "publication-artifact.json").read_text())
          require(run["id"] == int(os.environ["ARTIFACT_RUN"]), "Wrong artifact run")
          require(run["head_sha"] == os.environ["ARTIFACT_HEAD"], "Wrong tested PR head")
          require(run["path"].split("@")[0] == ".github/workflows/e2e-full.yml", "Wrong build workflow")
          require(run["event"] == "pull_request" and run["status"] == "completed", "Expected completed PR run")
          build = [job for job in jobs if job["name"] == "Build tested site"]
          require(len(build) == 1 and build[0]["conclusion"] == "success", "Fresh tested-site build was not green")
          require(artifact["id"] == int(os.environ["ARTIFACT_ID"]) and not artifact["expired"], "Missing or expired site artifact")
          require(artifact["name"] == "complete-e2e-site", "Wrong artifact name")
          require(artifact["workflow_run"]["id"] == run["id"] and artifact["workflow_run"]["head_sha"] == run["head_sha"], "Artifact/run provenance mismatch")
          require(artifact["digest"] == "sha256:d5a30c6bb6c8341ae0b1d144e48eab54d6ad26d1d549c8c957fbfb7df26bba79", "Artifact digest drift")
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          require(git("rev-parse", "HEAD") == os.environ["TESTED_MERGE"], "Wrong checkout HEAD")
          require(git("rev-parse", "--is-shallow-repository") == "false", "Incomplete Git history")
          require(git("show", "-s", "--format=%P", "HEAD").split() == [os.environ["TESTED_BASE"], os.environ["ARTIFACT_HEAD"]], "Tested merge parent drift")
          require(git("rev-parse", "HEAD^{tree}") == git("rev-parse", os.environ["ARTIFACT_HEAD"] + "^{tree}"), "PR merge is not the reviewed head tree")
          changed = set(git("diff", "--name-only", os.environ["ARTIFACT_HEAD"], os.environ["DISPATCH_SHA"]).splitlines())
          require(changed <= {".github/workflows/e2e-full.yml", "e2e/journeys/published-time.spec.ts"}, "Diagnostic branch includes changes beyond workflow and oracle instrumentation")
          spec = "e2e/journeys/published-time.spec.ts"
          pathlib.Path(spec).write_bytes(subprocess.check_output(["git", "show", os.environ["DISPATCH_SHA"] + ":" + spec]))
          print(json.dumps({"artifact_run": run["id"], "artifact_id": artifact["id"], "artifact_digest": artifact["digest"], "pr_head": run["head_sha"], "checkout_head": git("rev-parse", "HEAD"), "tree": git("rev-parse", "HEAD^{tree}"), "test_overlay_from": os.environ["DISPATCH_SHA"], "changed_paths": sorted(changed)}))
          PYVERIFY

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Install source dependencies for publication journeys
        run: npm ci --no-audit --no-fund
        working-directory: source

      - name: Download the previously tested site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: complete-e2e-site
          run-id: "36237655834"
          github-token: ${{ github.token }}

      - name: Extract and verify the original emitted assets
        run: |
          tar -xzf complete-e2e-site.tgz
          for built in neural/dist/*; do
            test -f "$built"
            cmp "$built" "source/public/static/neural/app/$(basename "$built")"
          done
          cmp source/quartz/static/neural/graph-data.json source/public/static/neural/graph-data.json
          test "$(git rev-parse HEAD)" = "$TESTED_MERGE"

      - name: Install the locked Chromium version
        run: npx playwright install --with-deps chromium

      - name: Run only the unchanged publication equality with diagnostics
        env:
          PUBLICATION_GIT_DIAGNOSTIC: "1"
        run: npm test -- e2e/journeys/published-time.spec.ts:32

      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publication-diagnostic-${{ github.run_id }}
          path: |
            e2e/test-results/
            test-results/
          if-no-files-found: warn
