name: Complete Playwright E2E

on:
  pull_request:
    branches: ["main", "dev"]
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complete-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tested site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate Neural app and data
        run: npm run regenerate:neural

      - name: Build production site and Forward libraries
        run: npm run build

      - name: Package tested site
        # THE WHOLE TREE, NOT AN ALLOW-LIST (v1.104.6). The list below used to name six paths, and
        # it predated every spec that reads a seventh: share-camera/share-lists/share-mobile
        # readFileSync `public/l.html`, `_redirects` and `l-manifest.json`; legacy-gone and
        # static-article-layout `goto("/Positions/Mount/Top")`; systems-surface goes to
        # `/Systems/*`; the SEO journey fetches `/sitemap.xml` and `/llms.txt`. None were packaged,
        # so the full sharded suite — the PR gate for BOTH main and dev — could not pass, and
        # nothing reported the drift because an allow-list rots silently. If size ever bites, use
        # --exclude: a new emitted path must be packaged by DEFAULT.
        run: tar -czf complete-e2e-site.tgz -C source public

      - name: Upload tested site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: complete-e2e-site
          path: complete-e2e-site.tgz
          retention-days: 1

  test:
    name: E2E shard ${{ matrix.shard }}/4
    needs: build
    runs-on: ubuntu-latest
    # Ceiling lowered 45 -> 25 so a hung shard fails in under half an hour instead of
    # parking a runner for three quarters of one. 4 shards is the measured optimum
    # (N=4 ~13.6 min wall vs N=2 ~21.3 min) — do not change the shard count to chase
    # this number.
    #
    # Why 25 and not 15: the only green full-suite run in CI history (31238865387, main,
    # 2026-08-08) had shards at 12m38s / 19m34s / 24m01s / 19m32s, so a 15-minute ceiling
    # would have killed three of the four. That run predates the v1.76.4 WebGL
    # nav-commit fix, and the post-fix speedup measured on the curated gate (5m51s ->
    # 1m57s on CI, ~3x) projects the worst shard to ~8-9 min — but that is a projection:
    # no post-fix SHARDED run exists yet to confirm it. A timeout exists to bound a hang,
    # so it must sit above the slowest run we have actually observed; picking 15 on an
    # unverified projection would risk reddening the gate on every PR into main and dev.
    # 25 still reclaims 20 minutes per stuck shard and cannot break a working run.
    #
    # TIGHTEN THIS to 15 once one post-fix sharded run is green — check the real per-shard
    # durations first and set the ceiling from them, not from this comment.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Download tested site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: complete-e2e-site

      - name: Extract tested site
        run: |
          mkdir -p source
          tar -xzf complete-e2e-site.tgz -C source

      # Key the browser cache on the PLAYWRIGHT VERSION, never on the lockfile hash.
      # This repo bumps package.json on every commit and package-lock.json mirrors that
      # version, so a hashFiles('package-lock.json') key changed on essentially every
      # commit. Verified on run 31319192519: "Cache not found for input keys:
      # Linux-playwright-f9289ead..." followed at post-job by "Sent 274155745 of
      # 274155745" — a MISS on every run that still uploaded 261 MiB on every run, i.e.
      # strictly worse than having no cache at all. Four shards paid that toll each.
      # The resolved @playwright/test version is the correct key because it is exactly
      # what decides which browser revision `npx playwright install` expects, and it
      # still moves when Playwright is upgraded — so an upgrade can never score an exact
      # hit on browsers built for the old revision. A restore-keys near-miss is safe for
      # the same reason: a prefix match leaves `cache-hit` false, so the full install
      # step below still runs and fetches the correct revision. Do NOT "improve" those
      # `if:` guards to use cache-matched-key — that is what would resurrect the
      # revision-mismatch failure this repo has already been bitten by.
      - name: Resolve Playwright version
        id: pw-version
        run: |
          V="$(node -p "require('@playwright/test/package.json').version" 2>/dev/null || true)"
          if [ -z "$V" ]; then
            V="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version" 2>/dev/null || true)"
          fi
          if [ -z "$V" ]; then
            echo "::error::Could not resolve the @playwright/test version; refusing to key the browser cache on a guess."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Playwright $V"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run complete E2E shard
        run: npm test -- --shard=${{ matrix.shard }}/4

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: complete-e2e-results-${{ matrix.shard }}
          path: |
            e2e/test-results/
            test-results/
          if-no-files-found: ignore
