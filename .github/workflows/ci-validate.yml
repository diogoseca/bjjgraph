name: Content & Graph Validation

# Plan §A.1 — the graph-integrity CI gate. Runs the existing Python validators on
# every content/template/script PR (and dev pushes). Two gates:
#   1. Schema validation (validate_json.py)  — HARD fail on any schema break.
#   2. Graph integrity (validate_graph_integrity.py) — RATCHET: fails only if the
#      error-severity count rises above tests/artifacts/graph_validation_baseline.json.
#      This tolerates the pre-existing backlog but blocks any NEW errors from landing.
# No Claude calls; pure CI, zero ongoing cost.

on:
  pull_request:
    paths:
      - "content/**"
      - "templates/**"
      - "scripts/**"
      - "graph.json"
      - "tests/artifacts/graph_validation_baseline.json"
      - "node_ordinals.json"
      # the ordinal gate's INPUT is the layout: a node added there without a mint is exactly what
      # validate:ordinals exists to catch, and the filter used to let that PR through untested.
      - "source/quartz/static/globalGraphLayout.json"
      # test:units pins the neural sources, not just the codec file
      - "neural/src/**"
      - "neural/src/lists-codec.src.js"
      - "tests/*.test.mjs"
      # tests/analytics_surface_gate.test.mjs pins its fixtures VERBATIM to the PostHog snippet in
      # this emitter, so that a vendor-snippet change cannot leave the analytics deploy gate
      # matching bytes the build no longer produces. Without this line a PR touching only the
      # emitter would never run the one test written to notice — the filter must include the
      # INPUTS its own gates read (CLAUDE.md §6.7), or the job goes green by never being triggered.
      - "source/quartz/plugins/emitters/componentResources.ts"
      # the CLAUDE.md budget + reference gates. Listing these is load-bearing, not tidiness:
      # a gate wired behind a path filter that excludes its own subject never runs on the PR
      # that breaks it, which is this repo's "absence produces a plausible answer" class in
      # its purest form — the job goes green by never being triggered.
      - "CLAUDE.md"
      - "docs/**"
      - "tests/artifacts/budget_docs.json"
      - ".github/workflows/ci-validate.yml"
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 2 commits so the ordinal gate can diff against HEAD^1 — on a PR that first
          # parent is the base-branch tip, which is exactly the baseline we must prove
          # append-only against.
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install jsonschema

      - name: Schema validation (hard gate)
        run: python3 scripts/validate_json.py --all

      # THE CORPUS THE STEPS BELOW READ IS GENERATED, NOT COMMITTED (v1.129.2).
      # `source/quartz/static/neural/` is gitignored in its entirety (.gitignore:71), so
      # `graph-data.json`, `curriculum.json` and the flashcard chunks do not exist on a fresh
      # checkout. The MC gate used to be introduced by a comment claiming it "reads the committed
      # chunk corpus" — it does not, and that false belief is why it was wired up with nothing to
      # emit the payload first. `e2e-full.yml` has always regenerated before its work; this
      # workflow never did. Inputs are all committed (graph.json, globalGraphLayout.json,
      # node_ordinals.json, content/), so this is self-contained and takes a few seconds.
      #
      # THIS STEP MUST STAY ABOVE "Pure unit suites" (v1.140.2). `tests/flow.test.mjs` (added in
      # v1.138.0) readFileSync's `source/quartz/static/neural/graph-data.json` at MODULE TOP
      # LEVEL — deliberately, so FLOW is exercised on the real wire and never on a spec-side
      # re-implementation (CLAUDE.md §6.3). With the emit below the unit step, that read threw
      # ENOENT before a single assertion ran, the whole FILE counted as one failure, and its 16
      # subtests were never collected: `node --test tests/*.test.mjs` reported 79 tests / 1 fail
      # where a provisioned checkout reports 94 / 0. Reproduce by deleting the directory.
      - name: Emit the neural payload (input to the unit suites and the MC gate)
        run: python3 scripts/regenerate_neural_data.py

      # Pure-unit suites (node --test, no browser, no build, ~4s): the share-link wire codec, the
      # neural deck-hydration contract, and the FLOW selfcheck. Separate from the Playwright
      # gates. Needs the payload above — see the ordering note there before moving either step.
      - name: Pure unit suites
        run: node --test tests/*.test.mjs

      # CLAUDE.md is loaded into EVERY session, so its size is a standing tax and its
      # references are acted on. Two cheap stdlib gates, no deps:
      #   budget — a char ratchet, plus the structural checks that make the file work at all
      #            (the CANONICAL-DISCLOSURE block two other gates parse out of it, no
      #            @-imports which would auto-load the archive straight back in, and a trap
      #            catalogue that still has entries in it).
      #   refs   — every repo path, `npm run` script and symbol@line citation it names must
      #            resolve. Every line citation in the pre-split file was wrong, six for six.
      - name: CLAUDE.md budget + references (gate)
        run: |
          python3 scripts/check_claudemd_budget.py
          python3 scripts/check_claudemd_refs.py

      # Share-link ordinal lockfile: HARD gate (no ratchet). Every live graph node must own
      # a permanent ordinal, and no committed ordinal may be renumbered, reused or deleted —
      # share links already posted in gym WhatsApp groups encode ordinals, so a renumber
      # silently changes which techniques those links open.
      - name: Share ordinal lockfile (append-only, hard gate)
        run: python3 scripts/regenerate_node_ordinals.py --check --baseline-ref HEAD^1

      # MC viability (hard gate by its own docstring: >=99% curriculum viability, zero
      # micro-answer decks, golden cross-anchors deliberately duplicated in
      # e2e/journeys/mc-flashcards.spec.ts so Python/JS drift breaks a gate). It ran in NO
      # workflow until v1.106.8 — and then could not PASS in one until v1.129.2, because the
      # payload above was missing. ~1 min, no browser.
      - name: MC viability audit (hard gate)
        run: npm run validate:mc

      - name: Graph integrity (ratchet against baseline)
        run: |
          # Remove any committed/stale report first: the validator exits non-zero on
          # the existing backlog (so we can't gate on its exit code), and `|| true`
          # would otherwise let a CRASHED validator fall through to a stale report and
          # pass. With the file gone, a crash makes json.load raise -> step fails.
          rm -f tests/artifacts/audit_report.json
          python3 scripts/validate_graph_integrity.py || true
          python3 - <<'PY'
          import json, os, sys

          report = json.load(open("tests/artifacts/audit_report.json"))  # FileNotFoundError if validator crashed
          baseline = json.load(open("tests/artifacts/graph_validation_baseline.json"))
          s = report["summary"]
          errs, cap = s["errors"], baseline["max_errors"]  # strict: missing core field -> fail closed

          summary = (
              "## Graph validation\n"
              f"- **errors: {errs}** (baseline cap {cap})\n"
              f"- warnings: {s.get('warnings','?')} · info: {s.get('info','?')} · total: {s.get('total_issues','?')}\n"
              f"- orphaned_submissions: {s.get('orphaned_submissions','?')} · "
              f"outcome_errors: {s.get('outcome_errors','?')} · attempt_outliers: {s.get('attempt_outliers','?')}\n"
          )
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout"), "a") as f:
              f.write(summary + "\n")
          print(summary)

          if errs > cap:
              print(
                  f"::error::Graph error-severity issues rose to {errs}, exceeding the baseline "
                  f"of {cap}. Fix the new error(s) before merging. (The baseline in "
                  f"tests/artifacts/graph_validation_baseline.json is lowered by a human as the "
                  f"backlog drains — it never auto-raises.)"
              )
              sys.exit(1)
          print(f"OK: {errs} error(s) <= baseline {cap}")
          PY
